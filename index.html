dy keeps us healthy and strong."],words:[{word:"Senses",meaning:"The five ways we sense the world: seeing, hearing, smelling, tasting and touching."},{word:"Body parts",meaning:"The different parts that make up our body, like hands, legs and head."}],mcqs:[{q:"Which body part do we use to see?",options:["Ears","Eyes","Nose","Hands"],answer:1},{q:"How many senses do we have?",options:["Three","Four","Five","Six"],answer:2}],fillBlanks:["We use our ______ to hear sounds. (ears)"],trueFalse:["We have five senses. (True)"],oneWord:["Which body part do we use to smell? — Nose"]},"1|Science|My Family":{overview:"A look at the people who make up a family — parents, grandparents, siblings — and how family members care for one another.",notes:"This lesson introduces the idea of family as people who live together and love and support each other. Children learn to name family members like mother, father, grandmother and grandfather, and understand that every family member has a role in helping the household run smoothly.",points:["A family is a group of people who live together and care for each other.","Every family member has a name and a role, like mother or grandfather.","Family members help and support one another."],words:[{word:"Family",meaning:"A group of people, like parents and children, who live together and care for each other."},{word:"Grandparents",meaning:"The parents of our mother or father."}],mcqs:[{q:"Who are the parents of our father called?",options:["Cousins","Grandparents","Neighbours","Friends"],answer:1},{q:"What do family members do for each other?",options:["Ignore each other","Care and support","Argue always","Nothing"],answer:1}],fillBlanks:["My mother and father are part of my ______. (family)"],trueFalse:["Family members support and care for each other. (True)"],oneWord:["What do we call the parents of our parents? — Grandparents"]},"1|Science|Plants Around Us":{overview:"An introduction to plants around us — trees, flowers, and small plants — and what they need to grow.",notes:"This lesson introduces children to the different kinds of plants they see around them, from tall trees to small potted plants and flowers. It explains that all plants need soil, water and sunlight to grow, helping children connect what they observe outdoors to a basic understanding of plant needs.",points:["Plants can be big, like trees, or small, like potted plants.","Plants need soil, water and sunlight to grow well.","Plants give us fruits, flowers, and clean air to breathe."],words:[{word:"Plant",meaning:"A living thing that grows in soil and needs water and sunlight, like a tree or flower."},{word:"Soil",meaning:"The earth in which plants grow their roots."}],mcqs:[{q:"What do plants need to grow?",options:["Only air","Soil, water and sunlight","Only stones","Nothing"],answer:1},{q:"Which of these is a plant?",options:["Chair","Tree","Table","Book"],answer:1}],fillBlanks:["Plants need soil, water and ______ to grow. (sunlight)"],trueFalse:["All plants need water and sunlight to grow. (True)"],oneWord:["What do we call the earth in which plants grow? — Soil"]},"1|Science|Animals Around Us":{overview:"An introduction to different animals we see around us — pets, farm animals and wild animals — and how they live.",notes:"This lesson introduces children to animals found at home (like dogs and cats), on farms (like cows and hens), and in the wild (like lions and elephants). It helps children notice how animals look different, make different sounds, and live in different places.",points:["Some animals live with us at home, like dogs and cats.","Some animals live on farms, like cows and hens.","Wild animals, like lions, live in forests."],words:[{word:"Pet",meaning:"An animal kept at home and cared for, like a dog or cat."},{word:"Wild animal",meaning:"An animal that lives freely in forests, not with people."}],mcqs:[{q:"Which of these is usually kept as a pet?",options:["Lion","Dog","Tiger","Elephant"],answer:1},{q:"Where do wild animals usually live?",options:["In houses","In forests","In classrooms","In cupboards"],answer:1}],fillBlanks:["A dog is an example of a ______. (pet)"],trueFalse:["Cows are usually found on farms. (True)"],oneWord:["Name one animal that lives in the forest. — Lion"]},"1|Science|Food We Eat":{overview:"A look at the different foods we eat every day, and why eating a variety of foods keeps us healthy.",notes:"This lesson introduces children to different kinds of food — fruits, vegetables, grains and milk — and explains that eating a mix of these keeps our body strong and healthy. It also gently touches on the idea of eating at proper mealtimes and avoiding too much junk food.",points:["We should eat a mix of fruits, vegetables, grains and milk.","Healthy food helps our body grow strong.","Eating too much junk food is not good for our health."],words:[{word:"Nutritious food",meaning:"Food that is good for our body and helps us stay healthy."},{word:"Grains",meaning:"Foods like rice and wheat that give us energy."}],mcqs:[{q:"Which of these is a healthy food?",options:["Vegetables","Only sweets","Only chips","Only soda"],answer:0},{q:"What does healthy food help our body do?",options:["Grow strong","Grow weak","Nothing","Feel sick"],answer:0}],fillBlanks:["Eating a mix of foods keeps our body ______. (healthy)"],trueFalse:["Eating too much junk food is good for health. (False)"],oneWord:["Name one healthy food group. — Vegetables"]},"1|Science|Water":{overview:"A simple lesson on water — where we find it, why we need it, and why we must not waste it.",notes:"This lesson explains that water is essential for drinking, cooking, cleaning and helping plants grow. Children learn that water comes from sources like rivers, wells and taps, and that it's important to use water carefully instead of wasting it.",points:["We need water for drinking, cooking and cleaning.","Water comes from sources like rivers, wells and taps.","We should not waste water — it should be used carefully."],words:[{word:"Water source",meaning:"A place water comes from, like a river, well or tap."},{word:"Waste",meaning:"Using more of something than needed, without care."}],mcqs:[{q:"Why do we need water?",options:["Only for play","Drinking, cooking and cleaning","Not needed at all","Only for pictures"],answer:1},{q:"What should we do with water?",options:["Waste it","Use it carefully","Throw it away","Ignore it"],answer:1}],fillBlanks:["We should not ______ water. (waste)"],trueFalse:["Water is important for drinking and cleaning. (True)"],oneWord:["Name one source of water. — River"]},"1|Science|Weather and Seasons":{overview:"An introduction to different kinds of weather and seasons — sunny, rainy, and cold — and how we dress for each.",notes:"This lesson introduces children to different weather conditions — sunny, rainy, and cold — and the seasons they belong to. It also explains how we choose different clothes, like umbrellas for rain or sweaters for cold weather, depending on the weather.",points:["Weather can be sunny, rainy, or cold.","We wear different clothes depending on the weather.","Seasons change through the year, like summer and winter."],words:[{word:"Weather",meaning:"The condition outside, like sunny, rainy, or cold."},{word:"Season",meaning:"A time of year with a particular kind of weather, like summer or winter."}],mcqs:[{q:"What do we use to stay dry in rainy weather?",options:["A fan","An umbrella","A ball","A book"],answer:1},{q:"What do we wear in cold weather?",options:["Sweaters","Swimsuits","Nothing","Sandals only"],answer:0}],fillBlanks:["We use an umbrella in ______ weather. (rainy)"],trueFalse:["We wear sweaters in cold weather. (True)"],oneWord:["Name one type of weather. — Sunny"]},"1|Science|Keeping Clean and Healthy":{overview:"Simple habits that help us stay clean and healthy, like washing hands and brushing teeth.",notes:"This lesson introduces basic hygiene habits such as washing hands before eating, brushing teeth twice a day, and bathing regularly. It helps children understand that these small daily habits protect us from germs and keep us healthy.",points:["We should wash our hands before eating.","Brushing teeth twice a day keeps them healthy.","Good hygiene habits protect us from germs and illness."],words:[{word:"Hygiene",meaning:"Habits that keep us clean and healthy, like washing hands."},{word:"Germs",meaning:"Tiny things we cannot see that can make us sick."}],mcqs:[{q:"When should we wash our hands?",options:["Never","Before eating","Only on Sundays","Only at night"],answer:1},{q:"How many times a day should we brush our teeth?",options:["Once","Twice","Five times","Never"],answer:1}],fillBlanks:["We should wash our hands before ______. (eating)"],trueFalse:["Brushing teeth twice a day keeps them healthy. (True)"],oneWord:["What do we call tiny things that can make us sick? — Germs"]},"1|Hindi|स्वर वर्णमाला (Swar Varnamala)":{overview:"हिंदी वर्णमाला के स्वरों — अ, आ, इ, ई, उ, ऊ, ए, ऐ, ओ, औ — की पहचान और उच्चारण का अभ्यास।",notes:"स्वर वे अक्षर हैं जिन्हें बिना किसी अन्य अक्षर की सहायता के बोला जा सकता है। इस पाठ में बच्चे हर स्वर को देखना, पहचानना और स्पष्ट उच्चारण के साथ बोलना सीखते हैं। हर स्वर के साथ एक सरल शब्द भी सिखाया जाता है, जैसे अ से अनार, आ से आम, ताकि अक्षर और उसकी ध्वनि आसानी से याद रहे।",points:["हिंदी में कुल 11 स्वर होते हैं, यहाँ मुख्य 10 सिखाए गए हैं।","हर स्वर को साफ़ और धीरे-धीरे बोलना चाहिए।","हर स्वर के लिए एक जाना-पहचाना शब्द याद रखने में मदद करता है।"],words:[{word:"स्वर",meaning:"वे अक्षर जिन्हें अकेले बोला जा सकता है, जैसे अ, आ, इ।"},{word:"उच्चारण",meaning:"किसी अक्षर या शब्द को बोलने का तरीका।"}],mcqs:[{q:"इनमें से कौन सा एक स्वर है?",options:["क","अ","त","म"],answer:1},{q:"'आम' शब्द किस स्वर से शुरू होता है?",options:["अ","इ","आ","उ"],answer:2}],fillBlanks:["______ से अनार। (अ)"],trueFalse:["स्वरों को अकेले बोला जा सकता है। (True)"],oneWord:["हिंदी वर्णमाला में सबसे पहला स्वर कौन सा है? — अ"]},"1|Hindi|व्यंजन वर्णमाला — भाग 1 (Vyanjan — Part 1)":{overview:"क से लेकर ञ तक के व्यंजनों की पहचान और उनके उच्चारण का अभ्यास।",notes:"व्यंजन वे अक्षर हैं जिन्हें बोलने के लिए स्वर की सहायता लेनी पड़ती है, जैसे क को बोलने के लिए 'क' में पहले से 'अ' जुड़ा होता है। इस पाठ में बच्चे क, ख, ग, घ, ङ, च, छ, ज, झ, ञ जैसे अक्षर पहचानना और लिखना सीखते हैं, साथ ही हर अक्षर से जुड़ा एक आसान शब्द भी सीखते हैं, जैसे क से कमल।",points:["व्यंजनों को बोलने के लिए स्वर की सहायता चाहिए होती है।","हर व्यंजन को धीरे-धीरे गिरवाकर लिखने का अभ्यास करना चाहिए।","हर अक्षर के लिए एक सरल शब्द याद रखने में मदद करता है, जैसे क से कमल।"],words:[{word:"व्यंजन",meaning:"वे अक्षर जिन्हें बोलने के लिए स्वर की सहायता लगती है, जैसे क, ख, ग।"},{word:"कमल",meaning:"एक फूल जो पानी में उगता है — 'क' से शुरू होने वाला शब्द।"}],mcqs:[{q:"'कमल' शब्द किस अक्षर से शुरू होता है?",options:["ख","क","ग","घ"],answer:1},{q:"इनमें से कौन सा एक व्यंजन है?",options:["अ","आ","च","उ"],answer:2}],fillBlanks:["______ से कमल। (क)"],trueFalse:["व्यंजनों को बोलने के लिए स्वर की सहायता चाहिए होती है। (True)"],oneWord:["'कमल' शब्द का पहला अक्षर कौन सा है? — क"]},"1|Hindi|व्यंजन वर्णमाला — भाग 2 (Vyanjan — Part 2)":{overview:"ट से लेकर स तक के शेष व्यंजनों की पहचान और उनके उच्चारण का अभ्यास।",notes:"यह व्यंजन-अभ्यास का अगला भाग है, जिसमें ट, ठ, ड, ढ, ण, त, थ, द, ध, न, प, फ, ब, भ, म, य, र, ल, व, श, ष, स, ह जैसे अक्षर शामिल हैं। बच्चे इन्हें बार-बार लिखने और बोलने का अभ्यास करते हैं, और हर अक्षर के लिए एक जाना-पहचाना शब्द भी सीखते हैं, जैसे म से मछली।",points:["हर व्यंजन को स्पष्ट रूप से बोलने का अभ्यास करना चाहिए।","पहचान आसान बनाने के लिए हर अक्षर के साथ एक शब्द जोड़ना मददगार होता है, जैसे म से मछली।","नियमित अभ्यास से अक्षर जल्दी याद हो जाते हैं।"],words:[{word:"मछली",meaning:"पानी में रहने वाला एक जीव — 'म' से शुरू होने वाला शब्द।"},{word:"नल",meaning:"पानी निकालने का एक साधन — 'न' से शुरू होने वाला शब्द।"}],mcqs:[{q:"'मछली' शब्द किस अक्षर से शुरू होता है?",options:["न","म","ल","र"],answer:1},{q:"'नल' शब्द किस अक्षर से शुरू होता है?",options:["म","न","प","स"],answer:1}],fillBlanks:["______ से मछली। (म)"],trueFalse:["'नल' शब्द 'न' अक्षर से शुरू होता है। (True)"],oneWord:["'मछली' शब्द का पहला अक्षर कौन सा है? — म"]},"1|Hindi|बारहखड़ी (Barakhadi)":{overview:"एक व्यंजन के साथ अलग-अलग स्वर जोड़कर बनने वाली मात्राओं — जैसे क, का, कि, की — का अभ्यास।",notes:"बारहखड़ी में एक ही व्यंजन के साथ हर स्वर की मात्रा जोड़कर नए रूप बनाए जाते हैं, जैसे क + आ की मात्रा = का, क + इ की मात्रा = कि। यह अभ्यास बच्चों को यह समझने में मदद करता है कि मात्रा जोड़ने से शब्द का उच्चारण कैसे बदलता है, जो आगे शब्द पढ़ने और लिखने के लिए ज़रूरी है।",points:["मात्रा जोड़ने से अक्षर का उच्चारण बदल जाता है।","हर व्यंजन के साथ बारी-बारी से सभी मात्राओं का अभ्यास करना चाहिए।","बारहखड़ी सीखने से नए शब्द पढ़ना आसान हो जाता है।"],words:[{word:"मात्रा",meaning:"स्वर का वह चिन्ह जो व्यंजन के साथ जोड़ा जाता है, जैसे का में ा।"},{word:"बारहखड़ी",meaning:"एक व्यंजन के साथ सभी स्वरों की मात्राएँ जोड़कर बनाई गई शब्द-श्रृंखला, जैसे क, का, कि, की।"}],mcqs:[{q:"'क' में 'आ' की मात्रा जोड़ने पर क्या बनता है?",options:["कि","का","के","कु"],answer:1},{q:"मात्रा जोड़ने से क्या बदलता है?",options:["रंग","उच्चारण","आकार","कुछ नहीं"],answer:1}],fillBlanks:["क + आ की मात्रा = ______ (का)"],trueFalse:["मात्रा जोड़ने से अक्षर का उच्चारण बदल जाता है। (True)"],oneWord:["'क' में 'इ' की मात्रा जोड़ने पर क्या बनता है? — कि"]},"1|Hindi|दो अक्षर वाले शब्द (Two-letter Words)":{overview:"दो अक्षरों को जोड़कर बनने वाले सरल शब्दों — जैसे नल, कमल, घर — को पढ़ने और पहचानने का अभ्यास।",notes:"इस पाठ में बच्चे दो अक्षरों को जोड़कर सरल शब्द बनाना और पढ़ना सीखते हैं, जैसे न + ल = नल। हर अक्षर को अलग-अलग पहचानने के बाद उन्हें साथ जोड़कर बोलने का अभ्यास कराया जाता है, जिससे शब्द पढ़ने की नींव मजबूत होती है।",points:["दो अक्षरों को जोड़कर सरल शब्द बनते हैं, जैसे न + ल = नल।","हर अक्षर को अलग-अलग पहचानना शब्द बनाने में मदद करता है।","छोटे शब्दों से शुरुआत करने पर पढ़ना आसान लगता है।"],words:[{word:"नल",meaning:"पानी निकालने का एक साधन — 'न' और 'ल' से बना शब्द।"},{word:"घर",meaning:"रहने की जगह — 'घ' और 'र' से बना शब्द।"}],mcqs:[{q:"'न' और 'ल' अक्षर जोड़ने पर कौन सा शब्द बनता है?",options:["घर","नल","कमल","मकर"],answer:1},{q:"'घर' शब्द में कितने अक्षर हैं?",options:["एक","दो","तीन","चार"],answer:1}],fillBlanks:["न + ल = ______ (नल)"],trueFalse:["दो अक्षर जोड़कर सरल शब्द बनाए जा सकते हैं। (True)"],oneWord:["'घ' और 'र' अक्षर जोड़ने पर कौन सा शब्द बनता है? — घर"]},"1|Hindi|कविता — चंदा मामा (Poem — Chanda Mama)":{overview:"चाँद को अपनेपन से 'चंदा मामा' कहकर पुकारने वाली एक प्यारी, लयबद्ध कविता।",notes:"यह कविता बच्चों के मन में चाँद के लिए स्नेह और कुतूहल जगाती है, उसे 'मामा' कहकर एक अपनापन दिया जाता है। इसे ताल के साथ ऊँची आवाज़ में गाने से बच्चों को लय, तुक और स्पष्ट उच्चारण का अभ्यास मिलता है, साथ ही आकाश और चाँद के प्रति जिज्ञासा भी बढ़ती है।",points:["इस कविता को ताल के साथ ज़ोर से गाना चाहिए।","यह चाँद के प्रति स्नेह और कुतूहल जगाती है।","इससे लय और स्पष्ट उच्चारण की आदत बनती है।"],words:[{word:"चंदा",meaning:"चाँद के लिए प्यार से इस्तेमाल किया जाने वाला शब्द।"},{word:"मामा",meaning:"माँ का भाई — यहाँ चाँद के लिए अपनेपन से इस्तेमाल हुआ है।"}],mcqs:[{q:"'चंदा मामा' कविता किसके बारे में है?",options:["सूरज","चाँद","तारे","बादल"],answer:1},{q:"इस कविता को कैसे पढ़ना चाहिए?",options:["चुपचाप","ताल के साथ ज़ोर से","बहुत धीरे","आँख बंद करके"],answer:1}],fillBlanks:["चंदा ______ — कविता ताल के साथ गानी चाहिए। (मामा)"],trueFalse:["यह कविता चाँद के बारे में है। (True)"],oneWord:["कविता में चाँद को क्या कहकर पुकारा गया है? — चंदा मामा"]},"1|Hindi|कहानी — होशियार खरगोश (Story — The Clever Rabbit)":{overview:"एक छोटे, चतुर खरगोश की कहानी जो अपनी सूझबूझ से मुश्किल से बाहर निकलता है।",notes:"इस कहानी में एक खरगोश को एक मुश्किल परिस्थिति का सामना करना पड़ता है, लेकिन वह घबराने की बजाय शांति से सोचकर एक चतुर तरीका ढूँढ़ लेता है। यह कहानी बच्चों को सिखाती है कि ताकत से ज़्यादा ज़रूरी है सूझबूझ से काम लेना, और सुनकर समझने का अभ्यास भी कराती है।",points:["यह कहानी सिखाती है कि सूझबूझ ताकत से ज़्यादा काम आती है।","मुश्किल समय में घबराने की बजाय शांति से सोचना चाहिए।","कहानी सुनकर समझने और अपने शब्दों में दोबारा कहने का अभ्यास मिलता है।"],words:[{word:"खरगोश",meaning:"लंबे कानों वाला एक छोटा जानवर।"},{word:"होशियार",meaning:"चतुर और समझदार।"}],mcqs:[{q:"कहानी का मुख्य पात्र कौन है?",options:["हाथी","खरगोश","बकरी","बंदर"],answer:1},{q:"खरगोश ने मुश्किल से कैसे निकला?",options:["लड़कर","होशियारी से","भागकर छिपकर","रोकर"],answer:1}],fillBlanks:["होशियार ______ — कहानी का नाम। (खरगोश)"],trueFalse:["यह कहानी सिखाती है कि सूझबूझ ताकत से ज़्यादा काम आती है। (True)"],oneWord:["कहानी में मुख्य पात्र कौन है? — खरगोश"]},"1|Hindi|मेरा परिवार (My Family)":{overview:"परिवार के सदस्यों — माँ, पिता, दादा, दादी — और साथ रहने के प्रेम पर आधारित एक सरल पाठ।",notes:"इस पाठ में बच्चे परिवार के सदस्यों के नाम और उनकी भूमिकाएँ सीखते हैं, जैसे माँ, पिता, दादा, दादी। साथ ही यह भी बताया गया है कि परिवार के सभी सदस्य एक-दूसरे की मदद और देखभाल करते हैं, जिससे घर से जुड़े सरल शब्दों का भंडार बढ़ता है।",points:["परिवार साथ रहता है और एक-दूसरे की देखभाल करता है।","हर सदस्य का एक नाम और भूमिका होती है, जैसे माँ, पिता।","परिवार के सदस्य एक-दूसरे से प्रेम करते हैं।"],words:[{word:"परिवार",meaning:"साथ रहने वाले माँ, पिता और अन्य सदस्यों का समूह।"},{word:"दादा-दादी",meaning:"पिता के माता-पिता।"}],mcqs:[{q:"'परिवार' शब्द का क्या अर्थ है?",options:["स्कूल","साथ रहने वाले सदस्य","खेल का मैदान","किताब"],answer:1},{q:"पिता के माता-पिता को क्या कहते हैं?",options:["मामा-मामी","दादा-दादी","चाचा-चाची","मौसा-मौसी"],answer:1}],fillBlanks:["मेरे ______ में माँ और पिता हैं। (परिवार)"],trueFalse:["परिवार के सदस्य एक-दूसरे की देखभाल करते हैं। (True)"],oneWord:["पिता के माता-पिता को क्या कहते हैं? — दादा-दादी"]},"1|Marathi|अग्गोबाई ढग्गोबाई (Aggobai Dhaggobai) — Poem":{overview:"ही एक मजेदार आणि तालबद्ध कविता आहे, जी मुले आनंदाने म्हणतात — या कवितेची खासियत तिच्या शब्दांच्या नादात आणि लयीत आहे.",easyExplain:"Ye ek mazedar, taalbaddh kavita hai. Ismein shabdon ka 'nad' (rhythm) hi khaas cheez hai — story nahi, keval sound aur laya. Bacchon ko taaliyaan bajate hue, zor se bolke seekhni chahiye. Isse ucchar (pronunciation) aur sunne ki aadat banti hai.",notes:"मराठीतील पहिल्या कवितांपैकी ही एक आहे, जी मुलांना लय, यमक आणि स्पष्ट उच्चार शिकवण्यासाठी वापरली जाते. ही कविता हातवारे करत मोठ्याने म्हटल्याने मुलांना शब्द आणि त्यांचा नाद यांच्यातील नाते समजते आणि भाषेतील गोडवा अनुभवायला मिळतो.",points:["ही कविता टाळ्या वाजवत, मोठ्याने म्हणावी.","शब्दांची निवड त्यांच्या नादासाठी आणि लयीसाठी केली आहे.","यामुळे ऐकण्याची व स्पष्ट उच्चाराची सवय लागते."],words:[{word:"अग्गोबाई",meaning:"कवितेत नादासाठी वापरलेला एक गमतीशीर शब्द."},{word:"ढग्गोबाई",meaning:"'अग्गोबाई' सोबत यमक जुळवण्यासाठी वापरलेला शब्द."}],mcqs:[{q:"अग्गोबाई ढग्गोबाई ही कोणत्या प्रकारची रचना आहे?",options:["गोष्ट (Story)","कविता (Poem)","पत्र (Letter)","निबंध (Essay)"],answer:1},{q:"ही कविता मुलांनी कशी शिकावी?",options:["शांतपणे वाचून","मोठ्याने म्हणून, टाळ्या वाजवत","फक्त लिहून","फक्त ऐकून"],answer:1}],fillBlanks:["अग्गोबाई ______ (Dhaggobai) — कविता तालासुरात म्हणावी."],trueFalse:["ही कविता मोठ्याने आणि तालासुरात म्हणायला हवी. (True)"],oneWord:["ही रचना कोणत्या भाषेत आहे? — मराठी"],videoQuery:"अग्गोबाई ढग्गोबाई कविता इयत्ता पहिली मराठी बालभारती",videoId:"dYgbwg6xFU4"},"1|Marathi|बीज (Beej) — Poem":{overview:"एका छोट्या बीजाचा प्रवास सांगणारी ही एक हळुवार कविता आहे — निसर्ग आणि संयम यांची पहिली ओळख करून देणारी.",easyExplain:"Ek chhote se beej ke dheere-dheere paudha aur phir bada ped bante jaane ki kahani. Sikhata hai: paudhe ko maati, paani aur dhoop chahiye, aur badhne mein waqt lagta hai — sabr rakhna zaroori hai.",notes:"मातीत, पाण्यात आणि सूर्यप्रकाशात एक इवलेसे बीज हळूहळू रोपटे बनते आणि नंतर मोठे झाड बनते, हे या कवितेत सांगितले आहे. यातून मुलांना आजूबाजूच्या निसर्गाचे निरीक्षण करायला आणि छोट्या सुरुवातीतून मोठे परिणाम कसे मिळतात हे समजायला मदत होते.",points:["बीज वाढण्यासाठी माती, पाणी आणि सूर्यप्रकाश आवश्यक असतो.","वाढीसाठी वेळ आणि संयम लागतो.","यामुळे मुलांची निसर्गाशी ओळख होते."],words:[{word:"बीज",meaning:"झाडाचा प्रारंभिक भाग, ज्यापासून रोप उगवते."},{word:"रोपटे",meaning:"बीजापासून तयार झालेले लहान झाड."}],mcqs:[{q:"बीजाला वाढण्यासाठी काय आवश्यक आहे?",options:["फक्त हवा","माती, पाणी आणि सूर्यप्रकाश","फक्त दगड","काहीच नाही"],answer:1},{q:"बीजापासून पुढे काय तयार होते?",options:["दगड","रोपटे","पाणी","वारा"],answer:1}],fillBlanks:["बीजाला ______ आणि पाणी लागते. (सूर्यप्रकाश)"],trueFalse:["बीज लगेच झाड बनते, वेळ लागत नाही. (False)"],oneWord:["बीजापासून काय तयार होते? — रोपटे"],videoQuery:"बीज कविता इयत्ता पहिली मराठी बालभारती",videoId:"OeEf2VV3ESE"},"1|Marathi|माझे खेळ (My Games)":{overview:"मुले खेळत असलेल्या खेळांविषयीचा हा एक सोपा धडा आहे — घरात आणि मैदानात — आणि एकत्र खेळण्याचे महत्त्व सांगणारा.",easyExplain:"Bacche maidan mein kaunse khel khelte hain — lapaachhipi, gend ka khel, rassi kudna. Sikhata hai: khelne se tandurusti milti hai, aur har khel ke aasan niyam hote hain jo sabko maanne chahiye.",notes:"या भागात लपाछपी, चेंडूचे खेळ आणि दोरीवरच्या उड्या यांसारख्या रोजच्या खेळांबद्दल सांगितले आहे, जे मुले मित्रांसोबत खेळतात. यातून एकत्र खेळण्याचा आनंद, सोपे नियम पाळणे आणि तंदुरुस्त राहणे यांचे महत्त्व अधोरेखित होते.",points:["मैदानात खेळल्याने आपण तंदुरुस्त राहतो.","प्रत्येक खेळाचे सोपे नियम असतात, ते सर्वांनी पाळावेत.","मित्रांसोबत खेळल्याने वाटून घेणे व आळीपाळी शिकायला मिळते."],words:[{word:"खेळ",meaning:"मनोरंजनासाठी खेळली जाणारी कृती."},{word:"मैदान",meaning:"खेळण्यासाठी असलेली मोकळी जागा."}],mcqs:[{q:"मुले मैदानात काय करतात?",options:["झोपतात","खेळतात","स्वयंपाक करतात","वाचन करतात"],answer:1},{q:"खेळताना कोणती सवय शिकायला मिळते?",options:["भांडणे करणे","आळीपाळीने खेळणे","एकटे राहणे","गोंधळ करणे"],answer:1}],fillBlanks:["आम्ही ______ मध्ये खेळतो. (मैदानात)"],trueFalse:["खेळल्याने आपण तंदुरुस्त राहतो. (True)"],oneWord:["मुले कुठे खेळतात? — मैदानात"],videoQuery:"माझे खेळ इयत्ता पहिली मराठी बालभारती धडा",videoId:"E1CEuXn9FT4"},"1|Marathi|माझे मित्र (My Friends)":{overview:"मैत्रीविषयीचा हा एक धडा आहे — चांगला मित्र कसा असतो आणि वाटून घेणे व दयाळूपणा का महत्त्वाचे आहे, हे सांगणारा.",easyExplain:"Achha dost kaisa hota hai — madad karta hai, cheezein baantta hai, pyaar se baat karta hai. Sikhata hai: dosti mein dayaluta aur sahyog zaroori hai.",notes:"खेळणी वाटून घेणे, दुखावलेल्या मित्राला मदत करणे, आणि एकत्र आनंदाने खेळणे अशा सोप्या उदाहरणांतून या धड्यात मैत्रीची ओळख करून दिली आहे. यातून दयाळूपणा आणि सहकार्य ही मूल्ये हळुवारपणे शिकवली जातात.",points:["चांगले मित्र एकमेकांना वाटून देतात आणि मदत करतात.","आपण आपल्या मित्रांशी दयाळूपणे वागावे.","एकत्र खेळल्याने मैत्री अधिक घट्ट होते."],words:[{word:"मित्र",meaning:"आपल्यासोबत खेळणारी व आपल्यावर प्रेम करणारी व्यक्ती."},{word:"मदत",meaning:"दुसऱ्याला काही करण्यास साहाय्य करणे."}],mcqs:[{q:"चांगला मित्र काय करतो?",options:["भांडतो","मदत करतो","एकटे खेळतो","रागावतो"],answer:1},{q:"मित्रांसोबत काय करायला आवडते?",options:["खेळणे","झोपणे","रडणे","लपणे"],answer:0}],fillBlanks:["मित्र एकमेकांना ______ करतात. (मदत)"],trueFalse:["मित्रांशी भांडण करणे चांगले असते. (False)"],oneWord:["आपण एकमेकांना काय करतो? — मदत"],videoQuery:"माझे मित्र इयत्ता पहिली मराठी बालभारती धडा",videoId:"BKr0XLXYYCw"},"1|Marathi|माझे कुटुंब (My Family)":{overview:"कुटुंबातील सदस्यांची आणि एकत्र राहण्याच्या ऊबेची ओळख करून देणारा हा धडा — नात्यांची समज मिळवण्याची पहिली पायरी.",easyExplain:"Aai, baba, aaji, aajoba — parivaar ke sadasya aur unki bhoomika. Sikhata hai: parivaar saath rehta hai, ek dusre ki dekhbhaal karta hai.",notes:"या धड्यात आई, बाबा, आजी, आजोबा यांसारख्या कुटुंबातील सदस्यांची ओळख करून दिली आहे आणि प्रत्येक सदस्य एकमेकांची काळजी कशी घेतो हे सांगितले आहे. यातून घर आणि नात्यांशी संबंधित शब्दसंग्रह वाढतो.",points:["कुटुंब एकत्र राहते आणि एकत्र जेवते.","प्रत्येक कुटुंबातील सदस्याचे नाव आणि भूमिका असते.","कुटुंबातील सदस्य एकमेकांवर प्रेम करतात आणि काळजी घेतात."],words:[{word:"आई",meaning:"आपल्याला जन्म देणारी व प्रेमाने सांभाळणारी स्त्री."},{word:"बाबा",meaning:"वडील."},{word:"आजी",meaning:"आईची किंवा बाबांची आई."}],mcqs:[{q:"'आई' या शब्दाचा अर्थ काय?",options:["वडील","आई","बहीण","मित्र"],answer:1},{q:"कुटुंबातील सदस्य एकमेकांशी कसे वागतात?",options:["प्रेमाने","रागाने","भीतीने","दुर्लक्षाने"],answer:0}],fillBlanks:["माझ्या कुटुंबात ______ आणि बाबा आहेत. (आई)"],trueFalse:["कुटुंबातील सदस्य एकमेकांची काळजी घेतात. (True)"],oneWord:["वडिलांना मराठीत काय म्हणतात? — बाबा"],videoQuery:"माझे कुटुंब इयत्ता पहिली मराठी बालभारती धडा",videoId:"PF10VrpoTzw"},"1|Marathi|माझी शाळा (My School)":{overview:"शाळेतील जीवनाबद्दलचा हा धडा — वर्ग, शिक्षक आणि मित्र — आणि शाळेत जाणे आनंददायी का असते हे सांगणारा.",easyExplain:"Shaala mein ek din kaisa hota hai — shikshak ko namaskar, mitro ke saath baithna, nayi cheezein seekhna. Naya shabdasangrah shaala se juda hua.",notes:"या धड्यात शाळेतील एक सर्वसाधारण दिवस सांगितला आहे — शिक्षकांना नमस्कार करणे, मित्रांसोबत बसणे, नवीन गोष्टी शिकणे आणि सुट्टीत खेळणे. यातून शाळेशी संबंधित सोपा शब्दसंग्रह तयार होतो.",points:["आपण शिक्षकांना आदराने नमस्कार करतो.","शाळेत आपण दररोज नवीन गोष्टी शिकतो.","शाळा ही मैत्री करण्याचीही जागा आहे."],words:[{word:"शाळा",meaning:"जिथे मुले शिकायला जातात ती जागा."},{word:"शिक्षक",meaning:"मुलांना शिकवणारी व्यक्ती."},{word:"वर्ग",meaning:"शाळेतील खोली जिथे शिकवले जाते."}],mcqs:[{q:"शाळेत कोण शिकवतात?",options:["आई","शिक्षक","मित्र","शेजारी"],answer:1},{q:"आपण वर्गात काय करतो?",options:["झोपतो","शिकतो","खेळतो फक्त","जेवतो फक्त"],answer:1}],fillBlanks:["शाळेत आम्हाला ______ शिकवतात. (शिक्षक)"],trueFalse:["शाळेत आपण नवीन गोष्टी शिकतो. (True)"],oneWord:["शिकवणाऱ्या व्यक्तीला काय म्हणतात? — शिक्षक"],videoQuery:"माझी शाळा इयत्ता पहिली मराठी बालभारती धडा",videoId:"SbhLXsiJeII"},"1|Marathi|क, म, आ, ल (Ka, Ma, Aa, La) — Letter practice":{overview:"क, म, आ आणि ल ही अक्षरे ओळखण्याचा व लिहिण्याचा सराव.",easyExplain:"Ye 4 akshar likhna-padhna seekhne ka abhyaas hai. Har akshar ke saath ek shabd — jaise क se कमळ (kamal). Pehle dheere girvao, phir khud likho, aur bolte hue likho.",notes:"हा हस्ताक्षर व अक्षरओळखीचा सराव आहे. मुले प्रत्येक अक्षर गिरवतात, पुन्हा पुन्हा लिहितात, त्या अक्षरापासून सुरू होणारा एक सोपा शब्द शिकतात आणि अक्षर लिहिण्याआधी त्याचा उच्चार मोठ्याने म्हणतात.",points:["प्रत्येक अक्षर आधी हळूहळू गिरवावे, नंतर स्वतः लिहावे.","लिहिताना अक्षराचा उच्चार मोठ्याने म्हणावा.","प्रत्येक अक्षरासाठी एक सोपा शब्द सराव करावा, उदा. क - कमळ."],words:[{word:"क",meaning:"प्रथम शिकवले जाणारे अक्षर — उदा. कमळ."},{word:"म",meaning:"उदा. मासा या शब्दातील पहिले अक्षर."},{word:"आ",meaning:"एक दीर्घ स्वर — उदा. आई या शब्दातील."},{word:"ल",meaning:"उदा. लाडू या शब्दातील पहिले अक्षर."}],mcqs:[{q:"'कमळ' या शब्दाचे पहिले अक्षर कोणते?",options:["म","क","ल","आ"],answer:1},{q:"'मासा' या शब्दाचे पहिले अक्षर कोणते?",options:["म","क","ल","आ"],answer:0}],fillBlanks:["______ + मळ = कमळ (क)"],trueFalse:["'ल' हे अक्षर 'लाडू' या शब्दात आहे. (True)"],oneWord:["'आई' मधील पहिले अक्षर कोणते? — आ"],videoQuery:"क म आ ल अक्षर ओळख इयत्ता पहिली मराठी बालभारती",videoId:"Bcup9zbUZ0g"},"1|Marathi|इ, घ, र, ई (I, Gha, Ra, Ee) — Letter practice":{overview:"इ, घ, र आणि ई ही अक्षरे ओळखण्याचा व लिहिण्याचा सराव.",easyExplain:"Agla akshar-abhyaas — इ aur ई mein farak (chhota vs lamba swar) samajhna zaroori hai. Har akshar ke liye ek shabd, jaise र se रवि (Ravi/surya).",notes:"अक्षरसरावाचा पुढचा भाग म्हणून मुले इ, घ, र आणि ई ही अक्षरे गिरवतात व लिहितात, प्रत्येकासाठी एक शब्द शिकतात आणि ऱ्हस्व इ व दीर्घ ई यांतील फरक समजून घेतात.",points:["इ आणि ई दिसायला सारखी वाटतात, पण उच्चार वेगळा असतो.","प्रत्येक अक्षरासाठी एक सोपा शब्द सराव करावा, उदा. र - रवि.","वेगाने लिहिण्यापेक्षा नीट व सावकाश लिहिणे महत्त्वाचे आहे."],words:[{word:"इ",meaning:"ऱ्हस्व स्वर — उदा. इमारत या शब्दातील."},{word:"घ",meaning:"उदा. घर या शब्दातील पहिले अक्षर."},{word:"र",meaning:"उदा. रवि (सूर्य) या शब्दातील."},{word:"ई",meaning:"दीर्घ स्वर — उदा. ईद या शब्दातील."}],mcqs:[{q:"'घर' या शब्दाचे पहिले अक्षर कोणते?",options:["र","घ","इ","ई"],answer:1},{q:"'इ' आणि 'ई' यांच्यात काय फरक आहे?",options:["काहीच फरक नाही","उच्चाराचा कालावधी (ऱ्हस्व/दीर्घ)","रंग","आकार"],answer:1}],fillBlanks:["______ + वि = रवि (र)"],trueFalse:["'इ' हा दीर्घ स्वर आहे. (False)"],oneWord:["'घर' मधील पहिले अक्षर कोणते? — घ"],videoQuery:"इ घ र ई अक्षर ओळख इयत्ता पहिली मराठी बालभारती",videoId:"okgNKFWcHwE"},"1|Marathi|झोपाळा गेला उडून (The Swing Flew Away) — Story":{overview:"एक झोपाळा जादूने उडून जातो, अशी कल्पनारम्य छोटी गोष्ट — मुलांच्या कुतूहलाला आणि कल्पनाशक्तीला चालना देणारी.",easyExplain:"Ek jhoole (swing) ke jaadu se ud jaane ki kalpanik kahani. Isse bacchon ki kalpanashakti aur kutuhal badhta hai, aur kahani apne shabdon mein dobara batane ka achha abhyaas milta hai.",notes:"या गोष्टीत सोप्या व खेळकर भाषेत एक कल्पनारम्य प्रसंग रंगवला आहे, ज्यामुळे लहान वाचकांना पुढे काय होईल याची कल्पना करायला आणि ती गोष्ट स्वतःच्या शब्दांत सांगायला प्रोत्साहन मिळते. ऐकून समजून घेण्याच्या सरावासाठी ही गोष्ट उपयुक्त आहे.",points:["यातून कल्पनाशक्ती व कुतूहल वाढते.","गोष्ट स्वतःच्या शब्दांत पुन्हा सांगण्याचा चांगला सराव मिळतो.","ऐकून समजून घेण्याची (श्रवण) क्षमता वाढते."],words:[{word:"झोपाळा",meaning:"बसून झोके घेण्यासाठीचे झूला."},{word:"उडून",meaning:"हवेत उडून गेलेले."}],mcqs:[{q:"गोष्टीत काय उडून जाते?",options:["पतंग","झोपाळा","पक्षी","फुगा"],answer:1},{q:"अशा गोष्टी वाचल्याने काय वाढते?",options:["भीती","कल्पनाशक्ती","राग","आळस"],answer:1}],fillBlanks:["______ गेला उडून. (झोपाळा)"],trueFalse:["ही गोष्ट खरी घडलेली घटना आहे. (False)"],oneWord:["गोष्टीचे नाव काय? — झोपाळा गेला उडून"],videoQuery:"झोपाळा गेला उडून गोष्ट इयत्ता पहिली मराठी बालभारती",videoId:"pBWOtAgw3Hc"},"1|English|Unit 1 — A Happy Song":{overview:"A cheerful song that helps children sing about feeling happy, using simple, easy-to-repeat words.",notes:"This is a poem meant to be sung aloud, not read silently. It uses simple words about feelings — being happy, glad and cheerful — and helps children practise clear pronunciation while enjoying the rhythm.",points:["Songs should be sung aloud, not read silently.","Helps learn feeling-words like happy and glad.","Good for pronunciation and rhythm practice."],words:[{word:"Happy",meaning:"Feeling joyful and pleased."},{word:"Song",meaning:"Words that are sung, usually with a rhythm or tune."}],mcqs:[{q:"What is 'A Happy Song' about?",options:["A sad day","Feeling happy and joyful","A rainy day","Going to school"],answer:1},{q:"How should a song be learnt?",options:["By reading silently","By singing it aloud","By writing it out","By sleeping"],answer:1}],fillBlanks:["When I am ______, I sing and smile. (happy)"],trueFalse:["Songs should be sung aloud with rhythm. (True)"],oneWord:["What do we call words that are sung with music? — Song"]},"1|English|Unit 1 — Nature":{overview:"An introduction to the natural world around us — trees, flowers, the sky, and animals.",notes:"This lesson introduces children to everyday elements of nature: the sun, trees, birds and flowers. It encourages them to look outside and notice the world around them.",points:["Nature includes trees, flowers, the sky and animals.","We should take care of nature around us.","Observing nature helps us learn new words."],words:[{word:"Nature",meaning:"Everything in the world that is not made by people, like trees, animals and rivers."},{word:"Sky",meaning:"The space above the earth that we see when we look up."}],mcqs:[{q:"Which of these is a part of nature?",options:["Chair","Tree","Table","Book"],answer:1},{q:"Where do birds fly?",options:["Under the ground","In the sky","Inside a box","In a cup"],answer:1}],fillBlanks:["Birds fly in the ______. (sky)"],trueFalse:["Trees are a part of nature. (True)"],oneWord:["Name one thing we see in nature. — Tree"]},"1|English|Unit 1 — Action Time":{overview:"A lively lesson introducing action words like run, jump, sit and stand through simple movements.",notes:"Children learn action words by acting them out — jumping when they hear 'jump', sitting when they hear 'sit'. Moving while learning helps young children connect a word to its meaning quickly.",points:["Action words describe what we do.","Acting out a word helps us remember it.","Examples: run, jump, sit, stand, clap."],words:[{word:"Action",meaning:"Something we do, like running or jumping."},{word:"Jump",meaning:"To push off the ground with your feet and rise into the air."}],m , B, C."}],mcqs:[{q:"How many letters are there in the English alphabet?",options:["20","24","26","30"],answer:2},{q:"Which of these is a capital letter?",options:["a","A","b","c"],answer:1}],fillBlanks:["The English alphabet has ______ letters. (26)"],trueFalse:["'a' is a capital letter. (False)"],oneWord:["What is the first letter of the alphabet? — A"]},"1|English|Unit 1 — Make Words":{overview:"A fun activity lesson where children combine letters to build simple, short words.",notes:"This lesson helps children practise putting letters together to make small words like 'cat', 'bat' and 'sun'. Sounding out each letter strengthens early spelling and reading skills.",points:["Words are made by joining letters together.","Start with short, 3-letter words.","Sounding out each letter helps in making words."],words:[{word:"Word",meaning:"A group of letters that together has a meaning."},{word:"Spell",meaning:"To say or write the letters of a word in the correct order."}],mcqs:[{q:"Which letters make the word 'cat'?",options:["c-a-t","c-a-p","b-a-t","c-u-t"],answer:0},{q:"What do we call a group of letters with meaning?",options:["Number","Word","Sound","Colour"],answer:1}],fillBlanks:["c + a + t = ______ (cat)"],trueFalse:["Words are made by joining letters together. (True)"],oneWord:["What do we call saying the letters of a word in order? — Spell"]},"1|English|Unit 1 — Letters on a Tab and Computer Keyboard":{overview:"An introduction to finding and recognising letters on a keyboard, using a tab or computer.",notes:"This lesson familiarises children with a keyboard — where letters are placed and how to find a specific one by looking carefully at the keys. It builds early digital literacy alongside letter recognition.",points:["A keyboard has keys for letters, numbers and symbols.","Letters on a keyboard are usually shown in capital form.","Looking carefully helps us find each letter quickly."],words:[{word:"Keyboard",meaning:"A set of keys used to type on a computer or ies builds listening and comprehension skills."],words:[{word:"Ball",meaning:"A round object used for playing games."},{word:"Careful",meaning:"Paying close attention so that nothing goes wrong."}],mcqs:[{q:"Who is the story about?",options:["Sunny","Soham","Mini","Tommy"],answer:1},{q:"What does Soham play with?",options:["A kite","A ball","A book","A car"],answer:1}],fillBlanks:["Soham plays with his ______. (ball)"],trueFalse:["We should take care of our things. (True)"],oneWord:["What did Soham play with? — Ball"]},"1|English|Unit 1 — Things that Go Together":{overview:"A matching lesson that teaches children to pair everyday items that naturally belong together, like a cup and a saucer.",notes:"This lesson gets children thinking about objects used together, like a shoe and a sock, or a pen and paper — building vocabulary along with early logical thinking.",points:["Some things are always used together.","Matching helps us understand how objects are related.","Examples: spoon and plate, shoe and sock."],words:[{word:"Match",meaning:"To put together two things that belong to each other."},{word:"Pair",meaning:"Two things that go together."}],mcqs:[{q:"Which two things go together?",options:["Shoe and Sock","Shoe and Spoon","Sock and Plate","Pen and Shoe"],answer:0},{q:"What do we call two things that go together?",options:["A pair","A single","A group","A line"],answer:0}],fillBlanks:["A cup and a ______ go together. (saucer)"],trueFalse:["A pen and paper go together. (True)"],oneWord:["What do we call two matching things? — Pair"]},"1|English|Unit 1 — Number Song":{overview:"A rhyming song that helps children learn to count in order, in a fun and musical way.",notes:"This song uses rhythm and rhyme to help children memorise number names in the correct order. Singing while counting on fingers makes numbers easier to remember.",points:["Numbers follow a fixed order: 1, 2, 3…","Singing helps us remember number names.","Counting on fingers while singing builds understanding."],words:[{word:"Number",meaning:"A word or symbol used for counting, like one, two, three."},{word:"Count",meaning:"To say numbers in their correct order."}],mcqs:[{q:"What comes after the number 'two'?",options:["One","Three","Four","Five"],answer:1},{q:"What helps us remember numbers easily?",options:["Sleeping","Singing a number song","Running","Drawing"],answer:1}],fillBlanks:["One, ______, three, four… (two)"],trueFalse:["Numbers always follow the same order. (True)"],oneWord:["What comes before 'two'? — One"]},"1|English|Unit 2 — Rain":{overview:"A short lesson about rain — where it comes from, how it sounds, and how it helps plants grow.",notes:"This lesson talks about rain falling from clouds, the pitter-patter sound it makes, and how children use umbrellas and raincoats to stay dry. It also touches on how rain is good for plants and the earth.",points:["Rain falls from clouds.","Rain helps plants and trees grow.","We use umbrellas or raincoats to stay dry."],words:[{word:"Rain",meaning:"Water that falls from clouds in the sky."},{word:"Umbrella",meaning:"An object we open and hold to stay dry in the rain."}],mcqs:[{q:"Where does rain come from?",options:["Ground","Clouds","Trees","Rivers"],answer:1},{q:"What do we use to stay dry in the rain?",options:["A fan","An umbrella","A ball","A book"],answer:1}],fillBlanks:["Rain falls from the ______. (clouds)"],trueFalse:["Rain helps plants grow. (True)"],oneWord:["What falls from clouds? — Rain"]},"1|English|Unit 2 — Things in My Classroom":{overview:"A lesson naming everyday objects found in a classroom, like a desk, chair and board.",notes:"This lesson helps children name and identify things around them in class — desks, chairs, the board, chalk and bags — building useful, everyday vocabulary.",points:["A classroom has desks, chairs and a board.","We keep our classroom things tidy.","Naming objects around us builds vocabulary."],words:[{word:"Classroom",meaning:"A room in school where students learn." prise each other.","We should respect and love our grandparents.","Giving surprises brings joy to both giver and receiver."],words:[{word:"Grandma",meaning:"Grandmother; the mother of one's parent."},{word:"Surprise",meaning:"Something unexpected and pleasant."}],mcqs:[{q:"Who was the surprise for?",options:["A friend","Grandma","A teacher","A neighbour"],answer:1},{q:"What does the story teach?",options:["Ignoring elders","Love and respect for grandparents","Fighting with family","Being selfish"],answer:1}],fillBlanks:["The children planned a surprise for their ______. (grandma)"],trueFalse:["We should respect our grandparents. (True)"],oneWord:["Who was surprised in the story? — Grandma"]},"1|English|Unit 5 — Tasty Treat":{overview:"A lesson about a delicious snack or treat, introducing food-related vocabulary.",notes:"This lesson describes a tasty treat being made or shared, helping children learn words related to food, taste and sharing snacks with others.",points:["Food can taste sweet, sour, salty or spicy.","Sharing treats with others is a kind gesture.","Trying new food can be a fun experience."],words:[{word:"Treat",meaning:"A special food enjoyed as a delight."},{word:"Tasty",meaning:"Having a pleasant flavour."}],mcqs:[{q:"What does 'tasty' mean?",options:["Bad smelling","Having a pleasant flavour","Very loud","Very heavy"],answer:1},{q:"What is a good habit when we have a treat?",options:["Eating alone secretly","Sharing with others","Wasting food","Throwing it away"],answer:1}],fillBlanks:["A tasty ______ makes everyone happy. (treat)"],trueFalse:["Sharing treats with others is kind. (True)"],oneWord:["What does 'tasty' mean? — Having a good flavour"]},"1|English|Unit 5 — Me, Myself and I":{overview:"A reflective lesson helping children describe themselves — their name, likes and features.",notes:"This lesson encourages children to talk about themselves, including their name, age, likes and appearance, building self-expression and confidence in using si otal.",notes:"This chapter introduces addition as putting two groups together to find how many there are in total, using objects and pictures before moving to number sentences like 2 + 3 = 5.",points:["Addition means combining two or more groups.","The '+' sign means 'add' or 'put together'.","Counting all objects together gives the total."],words:[{word:"Add",meaning:"To combine numbers or groups to find the total."},{word:"Sum",meaning:"The answer we get after adding numbers."}],mcqs:[{q:"What does the '+' sign mean?",options:["Subtract","Add","Divide","Multiply"],answer:1},{q:"What is 2 + 3?",options:["4","5","6","1"],answer:1}],fillBlanks:["2 + 3 = ______ (5)"],trueFalse:["Addition means combining groups. (True)"],oneWord:["What is the answer to an addition problem called? — Sum"]},"1|Mathematics|Subtraction":{overview:"An introduction to subtraction — taking away some objects from a group to find how many are left.",notes:"This chapter introduces subtraction as removing some objects from a group and counting what remains, using pictures and objects before number sentences like 5 - 2 = 3.",points:["Subtraction means taking away from a group.","The '-' sign means 'subtract' or 'take away'.","Counting what remains gives the answer."],words:[{word:"Subtract",meaning:"To take away one number from another."},{word:"Remain",meaning:"What is left after some is taken away."}],mcqs:[{q:"What does the '-' sign mean?",options:["Add","Subtract","Equal","Multiply"],answer:1},{q:"What is 5 - 2?",options:["2","3","7","5"],answer:1}],fillBlanks:["5 - 2 = ______ (3)"],trueFalse:["Subtraction means taking away. (True)"],oneWord:["What is left after taking some away called? — The remainder"]},"1|Mathematics|Numbers up to 100":{overview:"This chapter extends counting beyond 20, helping children recognise and count numbers up to 100.",notes:"Building on earlier place-value ideas, this chapter helps children count in tens and ones up to 100, recognise number patterns, and read larger numbers confidently.",points:["Numbers up to 100 can be grouped into tens and ones.","Counting in tens (10, 20, 30…) makes counting large numbers easier.","Number patterns help us predict what comes next."],words:[{word:"Tens",meaning:"A group of ten used to count larger numbers easily."},{word:"Hundred",meaning:"The number 100, equal to ten tens."}],mcqs:[{q:"What comes after 99?",options:["100","90","98","101"],answer:0},{q:"How many tens make 50?",options:["3","5","7","10"],answer:1}],fillBlanks:["10, 20, 30, ______, 50 (40)"],trueFalse:["100 is made up of ten tens. (True)"],oneWord:["What number comes right after 99? — 100"]},"1|Mathematics|Measurement — Length and Weight":{overview:"An early introduction to measuring things by length (long/short) and weight (heavy/light).",notes:"This chapter introduces measurement concepts without using instruments — comparing objects as longer/shorter or heavier/lighter — laying the groundwork for formal measurement later.",points:["We can compare objects by length: long or short.","We can compare objects by weight: heavy or light.","Comparing directly helps us understand measurement."],words:[{word:"Length",meaning:"How long or short something is."},{word:"Weight",meaning:"How heavy or light something is."}],mcqs:[{q:"Which word describes how long something is?",options:["Weight","Length","Colour","Taste"],answer:1},{q:"Which is usually heavier?",options:["A feather","A stone","A leaf","A balloon"],answer:1}],fillBlanks:["A pencil is usually ______ than a bus. (shorter)"],trueFalse:["We can compare objects by weight. (True)"],oneWord:["What word means 'how heavy something is'? — Weight"]},"1|Mathematics|Time":{overview:"A simple introduction to the concept of time — day and night, and reading the clock at a basic level.",notes:"This chapter introduces early ideas of time — morning, afternoon, evening, and night — and begins simple clock reading, helping children understand daily routines happen in order.",points:["A day has morning, afternoon, evening and night.","Clocks help us know the time.","Daily activities usually follow a set order."],words:[{word:"Clock",meaning:"A device used to tell the time."},{word:"Morning",meaning:"The early part of the day."}],mcqs:[{q:"Which part of the day comes first?",options:["Night","Morning","Evening","Afternoon"],answer:1},{q:"What do we use to tell the time?",options:["A clock","A spoon","A shoe","A book"],answer:0}],fillBlanks:["We use a ______ to tell the time. (clock)"],trueFalse:["A day has morning, afternoon, evening and night. (True)"],oneWord:["What do we use to know the time? — A clock"]},"1|Mathematics|Money":{overview:"An introduction to recognising coins and notes and understanding that money is used to buy things.",notes:"This chapter introduces Indian coins and notes, helping children recognise their value and understand that money is exchanged to buy goods and services.",points:["Money includes coins and notes.","Different coins and notes have different values.","We use money to buy things we need."],words:[{word:"Coin",meaning:"A round piece of metal money."},{word:"Note",meaning:"Paper money."}],mcqs:[{q:"What is a round piece of metal money called?",options:["Note","Coin","Card","Cheque"],answer:1},{q:"What is money used for?",options:["Buying things","Eating","Sleeping","Drawing"],answer:0}],fillBlanks:["We use money to ______ things we need. (buy)"],trueFalse:["A note is paper money. (True)"],oneWord:["What is paper money called? — Note"]},"1|Mathematics|Patterns":{overview:"A lesson on recognising and continuing simple patterns using shapes, colours or numbers.",notes:"This chapter helps children spot repeating patterns — like red, blue, red, blue — and predict what comes next, building early logical thinking and number sense.",points:["A pattern is something that repeats in a set order.","Patterns can be made with shapes, colours or numbers.","Spotting patterns helps build logical thinking."],words:[{word:"Pattern",meaning:"A repeated arrangement of shapes, colours or numbers."},{word:"Repeat",meaning:"To happen again in the same way."}],mcqs:[{q:"What is a pattern?",options:["A single object","A repeating arrangement","A colour","A number only"],answer:1},{q:"In the pattern red, blue, red, blue, what comes next?",options:["Red","Blue","Green","Yellow"],answer:0}],fillBlanks:["Red, blue, red, ______ (blue)"],trueFalse:["A pattern repeats in a set order. (True)"],oneWord:["What is a repeating arrangement called? — Pattern"]},"1|Mathematics|Data Handling":{overview:"A first look at organising simple information, like counting and sorting objects into groups.",notes:"This chapter introduces the idea of collecting and organising simple data, such as counting how many children like a particular fruit, and showing it using simple pictures or tally marks.",points:["Data means information we collect, like counts of things.","We can sort objects into groups to count them easily.","Simple pictures or tally marks can show data clearly."],words:[{word:"Data",meaning:"Information collected, often as numbers or facts."},{word:"Tally mark",meaning:"A simple mark used to count, usually in groups of five."}],mcqs:[{q:"What does 'data' mean?",options:["A toy","Information collected","A shape","A colour"],answer:1},{q:"What can we use to show counted data simply?",options:["Tally marks","Nothing","Only words","Only colours"],answer:0}],fillBlanks:["We can use ______ marks to count data. (tally)"],trueFalse:["Data means information we collect. (True)"],oneWord:["What is a simple way to record counts? — Tally marks"]},"2|Mathematics|Let's Find the Shapes!":{overview:"Building on Class 1, this chapter looks more closely at circles, squares, triangles and rectangles in everyday objects.",notes:"Children revisit basic shapes and practise spotting them in real objects around the classroom and home — a clock face (circle), a window (rectangle), a slice of bread cut diagonally (triangle). This visual matching strengthens shape recognition before geometric properties are introduced.",points:["Shapes are all around us, in windows, clocks, books and more.","A shape can be identified by its number of sides and corners.","Matching shapes to real objects makes them easier to remember."],words:[{word:"Corner",meaning:"The point where two sides of a shape meet."},{word:"Side",meaning:"A straight or curved line that forms part of the outline of a shape."}],mcqs:[{q:"A clock face is usually shaped like a:",options:["Triangle","Circle","Square","Rectangle"],answer:1},{q:"How many corners does a triangle have?",options:["2","3","4","5"],answer:1}],fillBlanks:["A triangle has ______ sides. (three)"],trueFalse:["A rectangle has four corners. (True)"],oneWord:["How many sides does a square have? — Four"],videoQuery:"Let's Find the Shapes! maths class 2 Maharashtra Balbharati"},"2|Mathematics|In the World of Numbers (up to 99)":{overview:"This chapter extends number recognition and counting confidently up to 99.",notes:"Children practise reading, counting and writing numbers from 1 to 99, building on the tens-and-ones idea from Class 1 so that numbers like 47 are understood as four tens and seven ones.",points:["Numbers up to 99 are made of tens and ones.","Counting forward and backward builds number confidence.","Recognising a number's position helps with comparing numbers later."],words:[{word:"Digit",meaning:"A single symbol used to write numbers, like 4 or 7."},{word:"Two-digit number",meaning:"A number made of two digits, from 10 to 99."}],mcqs:[{q:"Which of these is a two-digit number?",options:["7","47","607","0"],answer:1},{q:"What comes just after 98?",options:["97","99","100","89"],answer:1}],fillBlanks:["47 has ______ tens and 7 ones. (four)"],trueFalse:["99 is a two-digit number. (True)"],oneWord:["What is the biggest two-digit number? — 99"],videoQuery:"In the World of Numbers (up to 99) maths class 2 Maharashtra Balbharati"},"2|Mathematics|Let's Read and Write Numbers in Words":{overview:"This chapter teaches how to write numbers from 1 to 99 in words, like 'twenty-three' for 23.",notes:"Children learn the word-names for numbers, including tricky ones like eleven to nineteen, and practise matching a numeral to its word form and back again — a skill used constantly in reading and writing tasks.",points:["Every number has a word form, like 'five' for 5.","Numbers eleven to nineteen have special names that don't follow a simple pattern.","Practising both directions (numeral to word, word to numeral) builds fluency."],words:[{word:"Numeral",meaning:"The symbol form of a number, like 23."},{word:"Word form",meaning:"The way a number is written out in words, like twenty-three."}],mcqs:[{q:"How do we write 23 in words?",options:["Thirty-two","Twenty-three","Twenty-two","Three-two"],answer:1},{q:"Which numeral matches 'fifteen'?",options:["50","15","51","5"],answer:1}],fillBlanks:["30 is written in words as ______. (thirty)"],trueFalse:["11 is written as 'eleven' in words. (True)"],oneWord:["Write 10 in words. — Ten"],videoQuery:"Let's Read and Write Numbers in Words maths class 2 Maharashtra Balbharati"},"2|Mathematics|Counting in Groups":{overview:"A lesson on counting larger sets of objects quickly by grouping them, usually in twos, fives or tens.",notes:"Instead of counting objects one by one, children learn to count faster and more accurately by grouping them — for example, counting a pile of pencils in groups of five (5, 10, 15, 20) rather than one at a time.",points:["Grouping objects makes counting large numbers faster.","Common groups used are twos, fives and tens.","Counting in groups reduces mistakes compared to counting one by one."],words:[{word:"Group",meaning:"A small set of objects counted together, like a group of five."},{word:"Skip counting",meaning:"Counting forward by a fixed number each time, like 5, 10, 15."}],mcqs:[{q:"If we count in groups of 5, what comes after 15?",options:["16","20","25","18"],answer:1},{q:"Why do we count in groups?",options:["It's slower","It's faster and more accurate","It's more confusing","There's no reason"],answer:1}],fillBlanks:["Counting in groups of 5: 5, 10, ______, 20. (15)"],trueFalse:["Counting in groups can be faster than counting one by one. (True)"],oneWord:["What do we call counting forward by a fixed number each time? — Skip counting"],videoQuery:"Counting in Groups maths class 2 Maharashtra Balbharati"},"2|Mathematics|Place Value":{overview:"This chapter explains what each digit in a two-digit number actually represents — its place value.",notes:"Children learn that in a number like 36, the 3 stands for 3 tens (30) and the 6 stands for 6 ones. Understanding place value is essential for later addition, subtraction and understanding bigger numbers.",points:["Each digit in a number has a place value based on its position.","In a two-digit number, the left digit shows tens and the right digit shows ones.","Place value helps us understand what a number truly means."],words:[{word:"Place value",meaning:"The value a digit has because of its position in a number."},{word:"Tens place",meaning:"The position of a digit that shows how many tens are in a number."}],mcqs:[{q:"In the number 36, what does the 3 represent?",options:["3 ones","3 tens","3 hundreds","Nothing"],answer:1},{q:"In 52, what is in the ones place?",options:["5","2","50","20"],answer:1}],fillBlanks:["In the number 47, the digit 4 is in the ______ place. (tens)"],trueFalse:["In the number 29, the 9 is in the tens place. (False)"],oneWord:["In 64, which digit is in the ones place? — 4"],videoQuery:"Place Value maths class 2 Maharashtra Balbharati"},"2|Mathematics|The Expanded Form of a Number":{overview:"This chapter teaches how to break a two-digit number into its tens and ones parts, like 58 = 50 + 8.",notes:"Building directly on place value, children practise writing numbers in expanded form, which shows exactly how much each digit contributes to the total — reinforcing why place value matters.",points:["Expanded form breaks a number into the value of each digit.","58 in expanded form is 50 + 8.","This helps show why the position of a digit changes its value."],words:[{word:"Expanded form",meaning:"Writing a number as the sum of the values of its digits, like 50 + 8 for 58."}],mcqs:[{q:"What is the expanded form of 72?",options:["7 + 2","70 + 2","700 + 2","72 + 0"],answer:1},{q:"63 in expanded form is:",options:["60 + 3","6 + 3","30 + 6","63 + 0"],answer:0}],fillBlanks:["45 in expanded form is 40 + ______. (5)"],trueFalse:["The expanded form of 29 is 20 + 9. (True)"],oneWord:["What is the expanded form of 10? — 10 + 0"],videoQuery:"The Expanded Form of a Number maths class 2 Maharashtra Balbharati"},"2|Mathematics|Let's Count Numbers in Steps":{overview:"A lesson on skip counting forward by 2s, 5s and 10s to count faster and spot number patterns.",notes:"Children practise counting in steps — 2, 4, 6, 8… or 10, 20, 30… — which builds a foundation for later multiplication and helps them notice patterns in how numbers increase.",points:["Skip counting means counting forward by the same number each time.","Counting by 10s is a quick way to count large groups.","Skip counting patterns are the first step toward multiplication."],words:[{word:"Step",meaning:"The fixed amount added each time when skip counting."}],mcqs:[{q:"Counting by 10s from 10: 10, 20, 30, what comes next?",options:["31","40","35","50"],answer:1},{q:"Counting by 2s from 2: 2, 4, 6, what comes next?",options:["7","8","9","10"],answer:1}],fillBlanks:["Counting by 5s: 5, 10, ______, 20. (15)"],trueFalse:["Skip counting means counting by the same number each time. (True)"],oneWord:["What do we call the fixed number added each time? — Step"],videoQuery:"Let's Count Numbers in Steps maths class 2 Maharashtra Balbharati"},"2|Mathematics|Addition — Without Carrying":{overview:"This chapter teaches two-digit addition where the ones digits add up to less than 10, so no carrying is needed.",notes:"Children add tens and ones separately — for example, 23 + 14: add the ones (3+4=7), add the tens (20+10=30), then combine to get 37. This builds the foundation before carrying is introduced.",points:["Add the ones digits first, then the tens digits.","No carrying is needed when the ones add up to less than 10.","Lining up numbers by place value avoids mistakes."],words:[{word:"Carrying",meaning:"Moving extra value to the next place when a column adds to 10 or more."}],mcqs:[{q:"What is 23 + 14?",options:["36","37","38","47"],answer:1},{q:"In 23 + 14, what do we add first?",options:["The tens","The ones","Neither","Both at once randomly"],answer:1}],fillBlanks:["32 + 15 = ______ (47)"],trueFalse:["In 23 + 14, no carrying is needed. (True)"],oneWord:["What is 20 + 30? — 50"],videoQuery:"Addition — Without Carrying maths class 2 Maharashtra Balbharati"},"2|Mathematics|Addition — With Carrying":{overview:"This chapter introduces carrying over in addition, used when the ones digits add up to 10 or more.",notes:"When adding numbers like 28 + 15, the ones digits (8+5=13) are more than 9, so 1 ten is 'carried' over to the tens column. This is often the first genuinely tricky arithmetic skill children meet, so plenty of practice helps.",points:["Carrying is needed when the ones digits add up to 10 or more.","The extra ten is carried over and added to the tens column.","Careful lining up of digits by place value prevents errors."],words:[{word:"Carry",meaning:"The extra ten moved to the tens column during addition."}],mcqs:[{q:"What is 28 + 15?",options:["33","43","40","53"],answer:1},{q:"When do we carry over in addition?",options:["Always","When ones add to 10 or more","Never","Only with big numbers"],answer:1}],fillBlanks:["19 + 26 = ______ (45)"],trueFalse:["Carrying happens when the ones column adds up to 10 or more. (True)"],oneWord:["What is 9 + 5? — 14"],videoQuery:"Addition — With Carrying maths class 2 Maharashtra Balbharati"},"2|Mathematics|Subtraction":{overview:"This chapter extends subtraction to two-digit numbers, including cases where borrowing is needed.",notes:"Children practise subtracting two-digit numbers like 42 − 17, learning to borrow from the tens place when the ones digit being subtracted is larger than the ones digit on top.",points:["Subtract the ones first, then the tens.","Borrowing is needed when the top ones digit is smaller than the bottom ones digit.","Checking the answer by adding it back helps catch mistakes."],words:[{word:"Borrow",meaning:"Taking a ten from the tens place to help subtract in the ones place."}],mcqs:[{q:"What is 42 − 17?",options:["25","35","24","15"],answer:0},{q:"Why do we borrow in subtraction?",options:["For fun","When the top digit is smaller than the bottom digit","Always","Never"],answer:1}],fillBlanks:["50 − 23 = ______ (27)"],trueFalse:["Borrowing is needed when the top ones digit is smaller than the bottom one. (True)"],oneWord:["What is 10 − 4? — 6"],videoQuery:"Subtraction maths class 2 Maharashtra Balbharati"},"2|Mathematics|Comparing Numbers":{overview:"This chapter teaches how to compare two-digit numbers using greater than, less than and equal to.",notes:"Children compare numbers by first looking at the tens digit, then the ones digit if the tens are equal — for example, 42 is greater than 39 because 4 tens is more than 3 tens.",points:["To compare numbers, look at the tens digit first.","If tens are equal, compare the ones digit.","We use the words 'greater than', 'less than' and 'equal to' to compare."],words:[{word:"Greater than",meaning:"Having a larger value than another number."},{word:"Less than",meaning:"Having a smaller value than another number."}],mcqs:[{q:"Which is greater, 54 or 45?",options:["45","54","They are equal","Cannot say"],answer:1},{q:"Which part of a number do we compare first?",options:["Ones","Tens","Neither","Both equally"],answer:1}],fillBlanks:["36 is ______ than 63. (less)"],trueFalse:["42 is greater than 39. (True)"],oneWord:["Which is smaller, 18 or 81? — 18"],videoQuery:"Comparing Numbers maths class 2 Maharashtra Balbharati"},"2|Mathematics|Ascending and Descending Order":{overview:"This chapter teaches how to arrange a group of numbers from smallest to largest (ascending) or largest to smallest (descending).",notes:"Children practise comparing several numbers at once and then ordering them correctly, building directly on the comparing-numbers skill learnt just before this.",points:["Ascending order means arranging numbers from smallest to largest.","Descending order means arranging numbers from largest to smallest.","Comparing two numbers at a time helps build the full order."],words:[{word:"Ascending",meaning:"Increasing order, from smallest to largest."},{word:"Descending",meaning:"Decreasing order, from largest to smallest."}],mcqs:[{q:"Which of these is in ascending order?",options:["9, 5, 1","1, 5, 9","5, 9, 1","9, 1, 5"],answer:1},{q:"Descending order means arranging numbers from:",options:["Smallest to largest","Largest to smallest","Left to right only","Random order"],answer:1}],fillBlanks:["Arranging numbers from largest to smallest is called ______ order. (descending)"],trueFalse:["Ascending order goes from smallest to largest. (True)"],oneWord:["What is the opposite of ascending order? — Descending"],videoQuery:"Ascending and Descending Order maths class 2 Maharashtra Balbharati"},"2|Mathematics|Patterns":{overview:"Building on Class 1, this chapter looks at number patterns as well as shape and colour patterns.",notes:"Children extend their pattern skills to include simple number sequences, like 2, 4, 6, 8 (adding 2 each time), alongside the repeating shape and colour patterns from before.",points:["Patterns can be made with numbers, not just shapes and colours.","A number pattern often follows a simple rule, like 'add 2 each time'.","Finding the rule helps predict what comes next."],words:[{word:"Rule",meaning:"The fixed step that explains how a pattern continues."}],mcqs:[{q:"In the pattern 2, 4, 6, 8, what is the rule?",options:["Add 1","Add 2","Subtract 2","Multiply by 2"],answer:1},{q:"What comes next in 5, 10, 15, 20, __?",options:["22","25","30","21"],answer:1}],fillBlanks:["2, 4, 6, ______, 10 (8)"],trueFalse:["A number pattern can follow a rule like 'add 2 each time'. (True)"],oneWord:["What do we call the step a pattern follows? — Rule"],videoQuery:"Patterns maths class 2 Maharashtra Balbharati"},"2|Mathematics|Multiplication — Getting Started":{overview:"A gentle first introduction to multiplication as repeated addition, before formal tables are introduced.",notes:"Children learn that multiplication is just a quicker way of adding the same number several times — for example, 3 groups of 4 is the same as 4 + 4 + 4, which equals 12. This connects multiplication back to addition and skip counting they already know.",points:["Multiplication is repeated addition of the same number.","3 groups of 4 means 4 + 4 + 4.","Skip counting helps work out multiplication answers."],words:[{word:"Multiply",meaning:"To add the same number a certain number of times, quickly."},{word:"Group",meaning:"A set of the same number of objects, used in multiplication."}],mcqs:[{q:"3 groups of 4 is the same as:",options:["3 + 4","4 + 4 + 4","3 + 3 + 3 + 3","4 − 3"],answer:1},{q:"What is another way to think of multiplication?",options:["Repeated subtraction","Repeated addition","Comparing numbers","Counting backward"],answer:1}],fillBlanks:["2 groups of 5 is the same as 5 + ______. (5)"],trueFalse:["Multiplication is a quicker way of doing repeated addition. (True)"],oneWord:["What is 2 groups of 3 equal to? — 6"],videoQuery:"Multiplication — Getting Started maths class 2 Maharashtra Balbharati"},"2|Mathematics|Twelve Months in a Year":{overview:"This chapter introduces the twelve months of the year, their order, and how we use a calendar.",notes:"Children learn to name and order the twelve months, understand that a year is made of these months, and begin reading a simple calendar to find dates, days and upcoming events.",points:["A year has twelve months, from January to December.","Each month has either 28, 29, 30 or 31 days.","A calendar helps us keep track of dates and plan events."],words:[{word:"Calendar",meaning:"A chart that shows the days, weeks and months of a year."},{word:"Month",meaning:"One of the twelve parts that make up a year."}],mcqs:[{q:"How many months are there in a year?",options:["10","12","14","52"],answer:1},{q:"Which month comes right after January?",options:["March","December","February","April"],answer:2}],fillBlanks:["A year has ______ months. (twelve)"],trueFalse:["December is the last month of the year. (True)"],oneWord:["What is the first month of the year? — January"],videoQuery:"Twelve Months in a Year maths class 2 Maharashtra Balbharati"},"2|Science|My Family and Neighbours":{overview:"This chapter talks about our family members and the neighbours who live around us.",notes:"A family is a group of people who live together and care for each other. Neighbours are the people who live near our home, and we help each other in good and bad times.",points:["Family members care for and help one another.","Neighbours live near us and help us.","We should be polite and kind to everyone."],words:[{word:"Family",meaning:"People who live together and care for each other."},{word:"Neighbour",meaning:"A person who lives near our home."}],mcqs:[{q:"Who lives near our home?",options:["Stranger","Neighbour","Teacher","Doctor"],answer:1},{q:"Who cares for us at home?",options:["Family","Traffic","Clouds","Stones"],answer:0}],fillBlanks:["People who live near our home are called ______. (neighbours)"],trueFalse:["We should be rude to our neighbours. (False)"],oneWord:["What do we call people living together at home? — Family"],videoQuery:"My Family and Neighbours EVS class 2 Maharashtra"},"2|Science|My School":{overview:"This chapter introduces our school, classroom, teachers and friends.",notes:"School is a place where we learn new things and play with friends. We follow school rules, keep our classroom clean and respect our teachers.",points:["School is a place for learning and playing.","We should follow school rules.","We should keep our class clean and respect teachers."],words:[{word:"Classroom",meaning:"A room in school where students learn."},{word:"Rules",meaning:"Instructions that we must follow."}],mcqs:[{q:"Where do we go to learn?",options:["Market","School","Garden","Station"],answer:1},{q:"Who teaches us in school?",options:["Teacher","Driver","Farmer","Tailor"],answer:0}],fillBlanks:["We learn new things in ______. (school)"],trueFalse:["We should respect our teachers. (True)"],oneWord:["Who teaches us in class? — Teacher"],videoQuery:"My School EVS class 2 Maharashtra"},"2|Science|Our Body and Senses":{overview:"This chapter explains the parts of our body and our five senses.",notes:"We have eyes to see, ears to hear, a nose to smell, a tongue to taste and skin to touch. These are called the five senses, and we must take care of them.",points:["We have five senses.","Eyes see, ears hear, nose smells, tongue tastes, skin feels.","We must take care of our sense organs."],words:[{word:"Senses",meaning:"The five ways we know the world around us."},{word:"Sense organ",meaning:"A body part that helps us sense, like the eye or ear."}],mcqs:[{q:"Which organ helps us hear?",options:["Eye","Ear","Nose","Tongue"],answer:1},{q:"How many senses do we have?",options:["Three","Four","Five","Six"],answer:2}],fillBlanks:["We taste food with our ______. (tongue)"],trueFalse:["We smell with our eyes. (False)"],oneWord:["Which organ do we use to see? — Eye"],videoQuery:"Our Body and Senses EVS class 2 Maharashtra"},"2|Science|Food We Eat":{overview:"This chapter is about the different foods we eat and why healthy food is important.",notes:"We get food from plants and animals. Fruits, vegetables, milk, pulses and cereals give us energy and keep us healthy. We should wash our hands before eating and not waste food.",points:["Healthy food keeps us strong.","Food comes from plants and animals.","Wash hands before eating and do not waste food."],words:[{word:"Healthy food",meaning:"Food that is good for our body."},{word:"Energy",meaning:"The strength that helps us work and play."}],mcqs:[{q:"Which is a fruit?",options:["Mango","Brinjal","Rice","Wheat"],answer:0},{q:"What should we do before eating?",options:["Wash hands","Run","Sleep","Shout"],answer:0}],fillBlanks:["Milk is given to us by ______. (cow / animals)"],trueFalse:["Fruits and vegetables are healthy for us. (True)"],oneWord:["What gives us energy? — Food"],videoQuery:"Food We Eat EVS class 2 Maharashtra"},"2|Science|Plants Around Us":{overview:"This chapter introduces the plants around us and their parts.",notes:"Plants give us food, shade, flowers and fresh air. A plant has roots, a stem, leaves, flowers and fruits. Plants need water, sunlight and air to grow.",points:["Plants have roots, stem, leaves and flowers.","Plants need water and sunlight to grow.","Plants give us food and fresh air."],words:[{word:"Roots",meaning:"The part of a plant under the soil that takes in water."},{word:"Leaves",meaning:"The green parts of a plant that make food."}],mcqs:[{q:"Which part of a plant is under the soil?",options:["Leaf","Root","Flower","Fruit"],answer:1},{q:"What do plants need to grow?",options:["Water and sunlight","Plastic","Stones","Smoke"],answer:0}],fillBlanks:["Plants take in water through their ______. (roots)"],trueFalse:["Plants give us fresh air. (True)"],oneWord:["Which part of a plant holds the leaves? — Stem"],videoQuery:"Plants Around Us EVS class 2 Maharashtra"},"2|Science|Animals and Birds Around Us":{overview:"This chapter talks about animals and birds, where they live and what they eat.",notes:"Animals can be pet animals, farm animals or wild animals. Birds have feathers and wings, and most birds can fly. Animals and birds live in homes like nests, burrows, sheds and forests.",points:["Animals are of different kinds: pet, farm and wild.","Birds have feathers and wings.","Animals and birds have different homes."],words:[{word:"Pet animal",meaning:"An animal kept at home, like a dog or cat."},{word:"Nest",meaning:"A home made by birds."}],mcqs:[{q:"Which one is a bird?",options:["Parrot","Cow","Dog","Goat"],answer:0},{q:"Where does a bird live?",options:["Nest","Burrow","Pond only","Cave only"],answer:0}],fillBlanks:["A bird's home is called a ______. (nest)"],trueFalse:["All birds have feathers. (True)"],oneWord:["Which animal gives us milk? — Cow"],videoQuery:"Animals and Birds Around Us EVS class 2 Maharashtra"},"2|Science|Water — Uses and Saving":{overview:"This chapter explains how we use water and why we must save it.",notes:"We use water for drinking, bathing, cooking, washing and for plants. Water comes from rivers, wells, rain and taps. Water is precious, so we must not waste it.",points:["Water is used for many daily activities.","We get water from rivers, wells and rain.","We must save water and not waste it."],words:[{word:"Precious",meaning:"Very valuable and important."},{word:"Waste",meaning:"To use something carelessly."}],mcqs:[{q:"Which activity needs water?",options:["Drinking","Sleeping","Reading","Singing"],answer:0},{q:"What should we do with a leaking tap?",options:["Ignore it","Close or repair it","Open it more","Break it"],answer:1}],fillBlanks:["We must not ______ water. (waste)"],trueFalse:["Rain is a source of water. (True)"],oneWord:["What do we drink to quench thirst? — Water"],videoQuery:"Water — Uses and Saving EVS class 2 Maharashtra"},"2|Science|Air and Weather":{overview:"This chapter is about air around us and the changing weather.",notes:"Air is all around us. We cannot see it but we can feel it when the wind blows. Weather can be sunny, rainy, cloudy or windy, and we dress according to the weather.",points:["Air is all around us but we cannot see it.","Moving air is called wind.","Weather changes, and we dress to suit it."],words:[{word:"Wind",meaning:"Air that is moving."},{word:"Weather",meaning:"How the sky and air are on a given day, like sunny or rainy."}],mcqs:[{q:"What do we wear on a rainy day?",options:["Raincoat","Sweater","Sunglasses only","Nothing"],answer:0},{q:"Moving air is called ______.",options:["Wind","Rain","Cloud","Dust"],answer:0}],fillBlanks:["We cannot see ______ but we can feel it. (air)"],trueFalse:["Air is all around us. (True)"],oneWord:["What do we call moving air? — Wind"],videoQuery:"Air and Weather EVS class 2 Maharashtra"},"2|Science|Seasons and Festivals":{overview:"This chapter introduces the three main seasons and some festivals we celebrate.",notes:"The three main seasons are summer, rainy season (monsoon) and winter. We celebrate festivals like Diwali, Ganesh Chaturthi, Eid, Christmas and Holi with family and friends, sharing joy and sweets.",points:["There are three main seasons: summer, rainy and winter.","Festivals bring people together.","We should celebrate festivals safely and kindly."],words:[{word:"Season",meaning:"A part of the year with a particular kind of weather."},{word:"Festival",meaning:"A special day celebrated with joy."}],mcqs:[{q:"Which season is the hottest?",options:["Summer","Winter","Rainy","Spring"],answer:0},{q:"Which is a festival?",options:["Diwali","Monday","Table","Pencil"],answer:0}],fillBlanks:["The festival of lights is ______. (Diwali)"],trueFalse:["We wear sweaters in winter. (True)"],oneWord:["Which season brings the most rain? — Rainy season (monsoon)"],videoQuery:"Seasons and Festivals EVS class 2 Maharashtra"},"2|Science|Our Helpers — Occupations":{overview:"This chapter introduces people who help us through their work.",notes:"Many people do different work to help us. A doctor treats us, a teacher teaches us, a farmer grows food, a policeman keeps us safe and a postman delivers letters. We should respect all kinds of work.",points:["Different people do different jobs.","Every job is important.","We should respect all helpers."],words:[{word:"Occupation",meaning:"The work a person does to earn a living."},{word:"Helper",meaning:"A person who helps others."}],mcqs:[{q:"Who grows food for us?",options:["Farmer","Doctor","Driver","Tailor"],answer:0},{q:"Who treats us when we are ill?",options:["Doctor","Postman","Cobbler","Painter"],answer:0}],fillBlanks:["A ______ delivers our letters. (postman)"],trueFalse:["Every kind of work should be respected. (True)"],oneWord:["Who keeps us safe on the roads? — Policeman"],videoQuery:"Our Helpers — Occupations EVS class 2 Maharashtra"},"2|Science|Transport and Communication":{overview:"This chapter is about vehicles we travel in and ways to send messages.",notes:"We travel by land, water and air using buses, cars, trains, boats and aeroplanes. We communicate through letters, telephones and mobile phones. We must follow traffic rules while travelling.",points:["Transport is of three types: land, water and air.","We use phones and letters to send messages.","We must follow traffic rules."],words:[{word:"Transport",meaning:"The ways we travel from one place to another."},{word:"Communication",meaning:"Sharing messages with others."}],mcqs:[{q:"Which vehicle flies in the sky?",options:["Aeroplane","Bus","Boat","Cycle"],answer:0},{q:"Which is water transport?",options:["Boat","Train","Truck","Bike"],answer:0}],fillBlanks:["A train runs on ______. (tracks)"],trueFalse:["A boat is a land vehicle. (False)"],oneWord:["Which device helps us talk to people far away? — Telephone"],videoQuery:"Transport and Communication EVS class 2 Maharashtra"},"2|Science|Cleanliness and Good Habits":{overview:"This chapter teaches personal and surrounding cleanliness and good habits.",notes:"We should bathe daily, brush our teeth, cut our nails and wear clean clothes. We should also keep our home and surroundings clean and put waste in the dustbin.",points:["Keep ourselves clean every day.","Brush teeth twice a day.","Keep surroundings clean and use dustbins."],words:[{word:"Hygiene",meaning:"Keeping ourselves and our surroundings clean."},{word:"Dustbin",meaning:"A container where we throw waste."}],mcqs:[{q:"Where should we throw waste?",options:["Dustbin","Road","River","Class"],answer:0},{q:"How many times should we brush daily?",options:["Never","Twice","Ten times","Once a week"],answer:1}],fillBlanks:["We should wash our hands before ______. (eating)"],trueFalse:["We should cut our nails regularly. (True)"],oneWord:["What do we use to clean our teeth? — Toothbrush"],videoQuery:"Cleanliness and Good Habits EVS class 2 Maharashtra"},"2|Science|Safety at Home, School and Road":{overview:"This chapter teaches how to stay safe at home, at school and on the road.",notes:"We should not play with fire, sharp objects or electric switches. At school we should not push or run in corridors. On the road we should walk on the footpath and cross at the zebra crossing.",points:["Do not play with fire or sharp things.","Do not run or push at school.","Cross the road at a zebra crossing."],words:[{word:"Safety",meaning:"Being careful to avoid danger."},{word:"Zebra crossing",meaning:"Black and white stripes where we cross the road."}],mcqs:[{q:"Where should we cross the road?",options:["Zebra crossing","Anywhere","Middle of road","Near bend"],answer:0},{q:"Which is dangerous to play with?",options:["Fire","Ball","Book","Blocks"],answer:0}],fillBlanks:["We should walk on the ______ while on the road. (footpath)"],trueFalse:["We can play with electric switches. (False)"],oneWord:["What should we do at a red traffic light? — Stop"],videoQuery:"Safety at Home, School and Road EVS class 2 Maharashtra"},"2|Hindi|वर्णमाला की पुनरावृत्ति (Revision of Varnamala)":{overview:"हिंदी वर्णमाला के स्वर और व्यंजनों को दोहराने का अभ्यास।",notes:"हिंदी वर्णमाला में स्वर और व्यंजन होते हैं। इस पाठ में बच्चे सभी अक्षरों को पहचानना, सही क्रम में बोलना और लिखना दोहराते हैं। हर अक्षर से एक शब्द याद करने से प
