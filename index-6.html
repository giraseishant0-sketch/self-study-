ion means sharing equally. If 12 sweets are shared among 3 children, each gets 4. Division is the opposite of multiplication, so 12 ÷ 3 = 4 because 3 × 4 = 12.", "points": ["Division is equal sharing.", "Division is the opposite of multiplication.", "Dividend ÷ divisor = quotient."], "words": [{"word": "Quotient", "meaning": "The answer in division."}, {"word": "Divisor", "meaning": "The number we divide by."}], "mcqs": [{"q": "What is 20 ÷ 4?", "options": ["4", "5", "6", "16"], "answer": 1}, {"q": "What is 18 ÷ 3?", "options": ["5", "6", "7", "9"], "answer": 1}], "fillBlanks": ["The number we divide by is called the ______. (divisor)"], "trueFalse": ["10 ÷ 1 = 10. (True)"], "oneWord": ["What is 15 ÷ 3? — 5"], "videoQuery": "Division class 3 Mathematics Maharashtra Balbharati"},"3|Mathematics|Fractions":{"overview": "Understanding half, one-third and one-fourth as equal parts.", "notes": "A fraction shows equal parts of a whole. If a roti is cut into 2 equal parts, each part is one half (1/2). Four equal parts make quarters (1/4). Parts must be equal.", "points": ["A fraction is an equal part of a whole.", "Half is 1/2 and a quarter is 1/4.", "Two halves make one whole."], "words": [{"word": "Fraction", "meaning": "An equal part of a whole."}, {"word": "Half", "meaning": "One of two equal parts."}], "mcqs": [{"q": "A pizza is cut into 4 equal parts. One part is?", "options": ["1/2", "1/3", "1/4", "1/5"], "answer": 2}, {"q": "How many halves make a whole?", "options": ["1", "2", "3", "4"], "answer": 1}], "fillBlanks": ["One of two equal parts is called ______. (half)"], "trueFalse": ["1/2 is greater than 1/4. (True)"], "oneWord": ["How many quarters make one whole? — 4"], "videoQuery": "Fractions class 3 Mathematics Maharashtra Balbharati"},"3|Mathematics|Measurement of Length":{"overview": "Measuring length using centimetre, metre and kilometre.", "notes": "Length tells how long something is. Small things are measured in centimetres (cm), longer things in metres (m) n 1 litre.", "points": ["1 L = 1000 mL.", "Capacity is measured with measuring jugs.", "A spoon holds mL, a bucket holds L."], "words": [{"word": "Litre", "meaning": "A unit to measure liquids."}, {"word": "Capacity", "meaning": "How much a container can hold."}], "mcqs": [{"q": "1 litre equals how many mL?", "options": ["10", "100", "1000", "10000"], "answer": 2}, {"q": "Which holds more?", "options": ["Cup", "Bucket", "Spoon", "Glass"], "answer": 1}], "fillBlanks": ["1 L = ______ mL. (1000)"], "trueFalse": ["A bucket holds more water than a glass. (True)"], "oneWord": ["Which unit measures milk? — Litre"], "videoQuery": "Measurement of Capacity class 3 Mathematics Maharashtra Balbharati"},"3|Mathematics|Time and Calendar":{"overview": "Reading clocks and using the calendar.", "notes": "A clock has an hour hand and a minute hand. 60 minutes make 1 hour and 24 hours make 1 day. A year has 12 months and 365 days. A calendar shows days, weeks and months.", "points": ["60 minutes = 1 hour.", "7 days = 1 week.", "12 months = 1 year."], "words": [{"word": "Calendar", "meaning": "A chart showing days, weeks and months."}, {"word": "Minute", "meaning": "A small unit of time, 60 in an hour."}], "mcqs": [{"q": "How many days are in a week?", "options": ["5", "6", "7", "8"], "answer": 2}, {"q": "How many months are in a year?", "options": ["10", "11", "12", "13"], "answer": 2}], "fillBlanks": ["There are ______ hours in a day. (24)"], "trueFalse": ["The minute hand is longer than the hour hand. (True)"], "oneWord": ["How many minutes are in an hour? — 60"], "videoQuery": "Time and Calendar class 3 Mathematics Maharashtra Balbharati"},"3|Mathematics|Money":{"overview": "Rupees and paise, making amounts and simple bills.", "notes": "Our money is rupees (₹) and paise. 100 paise make 1 rupee. We use coins and notes to buy things. Total cost is found by adding prices and change is found by subtracting.", "points": ["100 paise = ₹1.", "Coins and notes are money.", "Change = money given − cost."], "words": [{"word": "Rupee", "meaning": "The main unit of Indian money."}, {"word": "Change", "meaning": "Money returned after paying."}], "mcqs": [{"q": "100 paise equal?", "options": ["₹1", "₹10", "₹100", "₹5"], "answer": 0}, {"q": "You pay ₹50 for a ₹30 pen. Change is?", "options": ["₹10", "₹20", "₹30", "₹80"], "answer": 1}], "fillBlanks": ["100 paise make one ______. (rupee)"], "trueFalse": ["We use notes and coins as money. (True)"], "oneWord": ["What is 20 + 30 rupees? — ₹50"], "videoQuery": "Money class 3 Mathematics Maharashtra Balbharati"},"3|Mathematics|Shapes and Patterns":{"overview": "Recognising basic shapes and simple patterns.", "notes": "Basic shapes are circle, square, rectangle and triangle. A triangle has 3 sides, a square has 4 equal sides and a rectangle has 4 sides with opposite sides equal. Patterns repeat in a fixed order.", "points": ["Triangle: 3 sides.", "Square: 4 equal sides.", "Patterns repeat in order."], "words": [{"word": "Pattern", "meaning": "Shapes or numbers repeated in order."}, {"word": "Side", "meaning": "A straight edge of a shape."}], "mcqs": [{"q": "How many sides does a triangle have?", "options": ["2", "3", "4", "5"], "answer": 1}, {"q": "Which shape has 4 equal sides?", "options": ["Triangle", "Circle", "Square", "Oval"], "answer": 2}], "fillBlanks": ["A circle has no ______. (corners)"], "trueFalse": ["A rectangle has 4 sides. (True)"], "oneWord": ["How many corners does a square have? — 4"], "videoQuery": "Shapes and Patterns class 3 Mathematics Maharashtra Balbharati"},"3|Science|Living and Non-living Things":{"overview": "Telling apart living and non-living things.", "notes": "Living things eat, breathe, grow, move and have babies. Plants and animals are living. Stones, tables and water are non-living because they do not grow or breathe.", "points": ["Living things grow and breathe.", "Non-living things do not grow.", "Plants are living."], "words": [{"word": "Living", "meaning": "Having life: eats, grows, breathes."}, {"word": "Non-living", "meaning": "Without life."}], "mcqs": [{"q": "Which is living?", "options": ["Stone", "Tree", "Chair", "Book"], "answer": 1}, {"q": "Which is non-living?", "options": ["Dog", "Bird", "Table", "Fish"], "answer": 2}], "fillBlanks": ["Living things need ______ to live. (food)"], "trueFalse": ["A stone can grow. (False)"], "oneWord": ["Name one living thing. — Plant"], "videoQuery": "Living and Non-living Things class 3 Science Maharashtra Balbharati"},"3|Science|Plants Around Us":{"overview": "Parts of a plant and their work.", "notes": "A plant has roots, stem, leaves, flowers and fruits. Roots take water from soil, the stem holds the plant, leaves make food using sunlight and flowers become fruits.", "points": ["Roots absorb water.", "Leaves make food.", "Flowers become fruits."], "words": [{"word": "Root", "meaning": "The part that takes water from soil."}, {"word": "Leaf", "meaning": "The part that makes food."}], "mcqs": [{"q": "Which part takes water from soil?", "options": ["Leaf", "Root", "Flower", "Fruit"], "answer": 1}, {"q": "Which part makes food for the plant?", "options": ["Root", "Stem", "Leaf", "Seed"], "answer": 2}], "fillBlanks": ["The ______ holds the plant upright. (stem)"], "trueFalse": ["Roots grow in soil. (True)"], "oneWord": ["Which part becomes a fruit? — Flower"], "videoQuery": "Plants Around Us class 3 Science Maharashtra Balbharati"},"3|Science|Animals Around Us":{"overview": "Kinds of animals, their food and homes.", "notes": "Animals live on land, in water and in the air. Some eat plants (herbivores), some eat meat (carnivores) and some eat both (omnivores). Animals live in homes like dens, nests and burrows.", "points": ["Herbivores eat plants.", "Carnivores eat meat.", "Animals live in different homes."], "words": [{"word": "Herbivore", "meaning": "An animal that eats only plants."}, {"word": "Carnivore", "meaning": "An animal that eats meat."}], "mcqs": [{"q": "Which animal is a herbivore?", "o bles keep us ______. (healthy)"], "trueFalse": ["We should wash hands before eating. (True)"], "oneWord": ["Name one healthy food. — Milk"], "videoQuery": "Food and Health class 3 Science Maharashtra Balbharati"},"3|Science|Water":{"overview": "Sources, uses and saving of water.", "notes": "Water comes from rivers, wells, rain and lakes. We use water for drinking, cooking, bathing and farming. Water must be clean, so we boil or filter it. We should not waste water.", "points": ["Rain is a source of water.", "Drink clean water.", "Save water."], "words": [{"word": "Source", "meaning": "The place from where we get something."}, {"word": "Filter", "meaning": "To clean water by passing it through a cloth or machine."}], "mcqs": [{"q": "Which is a source of water?", "options": ["Well", "Chair", "Road", "Book"], "answer": 0}, {"q": "How can we make water safe to drink?", "options": ["Boil it", "Mix mud", "Leave it open", "Add dust"], "answer": 0}], "fillBlanks": ["We should not ______ water. (waste)"], "trueFalse": ["Rain gives us water. (True)"], "oneWord": ["Name one use of water. — Drinking"], "videoQuery": "Water class 3 Science Maharashtra Balbharati"},"3|Science|Air":{"overview": "Properties and importance of air.", "notes": "Air is all around us. We cannot see it but we can feel it as wind. All living things need air to breathe. Moving air is called wind and it flies kites. Air gets dirty due to smoke.", "points": ["Air is all around.", "Living things need air.", "Moving air is wind."], "words": [{"word": "Wind", "meaning": "Moving air."}, {"word": "Breathe", "meaning": "To take in and let out air."}], "mcqs": [{"q": "Moving air is called?", "options": ["Water", "Wind", "Dust", "Fire"], "answer": 1}, {"q": "Who needs air?", "options": ["Only humans", "Only plants", "All living things", "No one"], "answer": 2}], "fillBlanks": ["We cannot ______ air but can feel it. (see)"], "trueFalse": ["Air has no colour. (True)"], "oneWord": ["What flies a kite? — Wind"], "videoQ visor.", "points": ["Division is the opposite of multiplication.", "Remainder < divisor.", "Check: divisor × quotient + remainder."], "words": [{"word": "Quotient", "meaning": "The answer in division."}, {"word": "Remainder", "meaning": "What is left after dividing."}], "mcqs": [{"q": "20 ÷ 4 = ?", "options": ["4", "5", "6", "16"], "answer": 1}, {"q": "17 ÷ 5 has remainder?", "options": ["1", "2", "3", "0"], "answer": 1}], "fillBlanks": ["The number that is divided is the ______. (dividend)"], "trueFalse": ["The remainder can be bigger than the divisor. (False)"], "oneWord": ["What is 36 ÷ 6? — 6"], "videoQuery": "Division class 4 Mathematics Maharashtra Balbharati"},"4|Mathematics|Fractions":{"overview": "Understanding fractions, comparing like fractions.", "notes": "A fraction shows equal parts of a whole, written numerator over denominator. In 3/4, 3 is the numerator and 4 the denominator. Fractions with the same denominator are compared by their numerators: 3/5 > 2/5.", "points": ["Numerator is the top number.", "Denominator is the bottom number.", "Equal parts are needed."], "words": [{"word": "Numerator", "meaning": "The number of parts taken."}, {"word": "Denominator", "meaning": "The total number of equal parts."}], "mcqs": [{"q": "In 2/5, the denominator is?", "options": ["2", "5", "7", "3"], "answer": 1}, {"q": "Which is greater?", "options": ["1/4", "3/4", "2/4", "0/4"], "answer": 1}], "fillBlanks": ["In 3/8, the numerator is ______. (3)"], "trueFalse": ["1/2 is the same as 2/4. (True)"], "oneWord": ["How many quarters make a whole? — 4"], "videoQuery": "Fractions class 4 Mathematics Maharashtra Balbharati"},"4|Mathematics|Geometrical Shapes":{"overview": "Lines, angles and basic 2-D shapes.", "notes": "Shapes have sides and corners. A triangle has 3 sides, a rectangle has 4 sides with opposite sides equal, a square has 4 equal sides. A line can be straight or curved. A right angle looks like the corner of a book.", "points": ["Triangle: 3 sides, rectangle & square: 4 sides.", "A square has equal sides.", "Right angle = 90°."], "words": [{"word": "Angle", "meaning": "The space between two lines meeting at a point."}, {"word": "Vertex", "meaning": "A corner of a shape."}], "mcqs": [{"q": "How many sides does a pentagon have?", "options": ["4", "5", "6", "7"], "answer": 1}, {"q": "A right angle measures?", "options": ["45°", "90°", "180°", "360°"], "answer": 1}], "fillBlanks": ["A triangle has ______ corners. (3)"], "trueFalse": ["A square has 4 equal sides. (True)"], "oneWord": ["How many sides does a hexagon have? — 6"], "videoQuery": "Geometrical Shapes class 4 Mathematics Maharashtra Balbharati"},"4|Mathematics|Measurement of Length and Weight":{"overview": "Units of length and weight and converting them.", "notes": "Length: 10 mm = 1 cm, 100 cm = 1 m, 1000 m = 1 km. Weight: 1000 g = 1 kg. To convert km to m multiply by 1000. We add and subtract measures with the same unit.", "points": ["1 m = 100 cm.", "1 km = 1000 m.", "1 kg = 1000 g."], "words": [{"word": "Kilometre", "meaning": "1000 metres."}, {"word": "Gram", "meaning": "A small unit of weight."}], "mcqs": [{"q": "2 km = ? m", "options": ["200", "2000", "20", "20000"], "answer": 1}, {"q": "3 kg = ? g", "options": ["300", "3000", "30", "30000"], "answer": 1}], "fillBlanks": ["1 kg = ______ g. (1000)"], "trueFalse": ["A ruler measures length. (True)"], "oneWord": ["1 m = how many cm? — 100"], "videoQuery": "Measurement of Length and Weight class 4 Mathematics Maharashtra Balbharati"},"4|Mathematics|Capacity":{"overview": "Measuring liquids in litres and millilitres.", "notes": "Capacity is the amount a container can hold. Units are litres (L) and millilitres (mL). 1 L = 1000 mL. We use measuring jugs and cups. Half a litre is 500 mL.", "points": ["1 L = 1000 mL.", "Half litre = 500 mL.", "Use a measuring jug."], "words": [{"word": "Capacity", "meaning": "How much a container can hold."}, {"word": "Millilitre", "meaning": "One thousandth of a litre."}], "mcqs": [{"q": "2 L = ? mL", "options": ["200", "2000", "20", "20000"], "answer": 1}, {"q": "Half litre is?", "options": ["250 mL", "500 mL", "750 mL", "100 mL"], "answer": 1}], "fillBlanks": ["1 litre = ______ mL. (1000)"], "trueFalse": ["A bucket has more capacity than a cup. (True)"], "oneWord": ["What unit measures milk? — Litre"], "videoQuery": "Capacity class 4 Mathematics Maharashtra Balbharati"},"4|Mathematics|Time":{"overview": "Reading time in hours and minutes, 24-hour and calendar.", "notes": "There are 60 minutes in an hour and 24 hours in a day. A clock shows time by an hour hand and a minute hand. A year has 12 months; a leap year has 366 days. We read am for morning and pm for afternoon.", "points": ["60 min = 1 hour.", "24 hours = 1 day.", "Leap year has 366 days."], "words": [{"word": "Leap year", "meaning": "A year with 366 days."}, {"word": "Duration", "meaning": "The length of time something takes."}], "mcqs": [{"q": "How many days in a leap year?", "options": ["364", "365", "366", "367"], "answer": 2}, {"q": "1 hour = ? minutes", "options": ["30", "60", "100", "24"], "answer": 1}], "fillBlanks": ["A day has ______ hours. (24)"], "trueFalse": ["February has 29 days in a leap year. (True)"], "oneWord": ["How many months have 30 days? — 4"], "videoQuery": "Time class 4 Mathematics Maharashtra Balbharati"},"4|Mathematics|Money":{"overview": "Rupees and paise, addition and bills.", "notes": "100 paise = ₹1. We add prices to find the bill and subtract to find change. Example: bill ₹85, paid ₹100, change ₹15. Always check the bill and count change.", "points": ["100 paise = ₹1.", "Total = sum of prices.", "Change = paid − bill."], "words": [{"word": "Bill", "meaning": "A paper showing the cost of things bought."}, {"word": "Change", "meaning": "Money returned after paying."}], "mcqs": [{"q": "A pen costs ₹25 and a book ₹60. Total?", "options": ["₹75", "₹85", "₹95", "₹65"], "answer": 1}, {"q": "You pay ₹100 for ₹70 goods. Change?", "options": ["₹20", "₹30", "₹40", "₹10"], "answer": 1}], "fillBlanks": ["₹1 = ______ paise. (100)"], "trueFalse": ["We subtract to find change. (True)"], "oneWord": ["What is ₹50 + ₹25? — ₹75"], "videoQuery": "Money class 4 Mathematics Maharashtra Balbharati"},"4|Mathematics|Perimeter":{"overview": "Finding the distance around shapes.", "notes": "Perimeter is the total length of the boundary of a shape. For a rectangle, perimeter = 2 × (length + breadth). For a square, perimeter = 4 × side. For a triangle, add all three sides.", "points": ["Perimeter = sum of all sides.", "Square: 4 × side.", "Rectangle: 2 × (l + b)."], "words": [{"word": "Perimeter", "meaning": "The total length around a shape."}, {"word": "Breadth", "meaning": "The shorter side of a rectangle."}], "mcqs": [{"q": "Perimeter of a square with side 5 cm?", "options": ["10 cm", "20 cm", "25 cm", "15 cm"], "answer": 1}, {"q": "Rectangle 6 cm × 4 cm: perimeter?", "options": ["10 cm", "20 cm", "24 cm", "12 cm"], "answer": 1}], "fillBlanks": ["The perimeter of a square of side 3 cm is ______ cm. (12)"], "trueFalse": ["Perimeter is measured in cm or m. (True)"], "oneWord": ["How many sides are added for a triangle's perimeter? — 3"], "videoQuery": "Perimeter class 4 Mathematics Maharashtra Balbharati"},"4|Mathematics|Patterns and Data":{"overview": "Number patterns and reading simple tables and graphs.", "notes": "A pattern follows a rule: 2, 4, 6, 8 adds 2 each time. Data can be shown in a table or a bar graph. A bar graph uses bars of different heights to compare things. We read the graph by looking at the title and the scale.", "points": ["Find the rule of a pattern.", "Bar graphs compare data.", "Read title and scale."], "words": [{"word": "Pattern", "meaning": "Numbers or shapes repeating by a rule."}, {"word": "Data", "meaning": "Collected information."}], "mcqs": [{"q": "Next number: 5, 10, 15, ?", "options": ["18", "20", "25", "30"], "answer": 1}, {"q": "A bar graph compares?", "options": ["Data", "Colours", "Names only", "Sounds"], "answer": 0}], "fillBlanks": ["The pattern 3, 6, 9, 12 adds ______ each time. (3)"], "trueFalse": ["A bar graph has a title. (True)"], "oneWord": ["What is the next number: 10, 20, 30? — 40"], "videoQuery": "Patterns and Data class 4 Mathematics Maharashtra Balbharati"},"4|Science|Living World":{"overview": "Characteristics of living things and their needs.", "notes": "Living things need food, water and air; they grow, respond, move and reproduce. Non-living things do not. Living things are of two types: plants and animals. They are all around us.", "points": ["Living things grow and reproduce.", "All need food, water, air.", "Plants and animals are living."], "words": [{"word": "Reproduce", "meaning": "To produce young ones."}, {"word": "Respond", "meaning": "To react to a change."}], "mcqs": [{"q": "Which is living?", "options": ["Rock", "Mango tree", "Pen", "Chair"], "answer": 1}, {"q": "A characteristic of living things:", "options": ["They grow", "They never move", "They never eat", "They are hard"], "answer": 0}], "fillBlanks": ["Living things ______ and reproduce. (grow)"], "trueFalse": ["Stones are living things. (False)"], "oneWord": ["Name one living thing. — Dog"], "videoQuery": "Living World class 4 Science Maharashtra Balbharati"},"4|Science|Plants and Their Parts":{"overview": "Parts of a plant: root, stem, leaf, flower, fruit.", "notes": "Roots hold the plant and take water. The stem carries water to leaves. Leaves make food by photosynthesis using sunlight. Flowers make fruits and seeds. Roots may be tap roots or fibrous roots.", "points": ["Roots absorb water.", "Leaves make food.", "Flowers make seeds and fruits."], "words": [{"word": "Photosynthesis", "meaning": "The process by which leaves make food using sunlight."}, {"word": "Tap root", "meaning": "One main thick root."}], "mcqs": [{"q": "Which part makes food?", "options": ["Root", "Stem", "Leaf", "Seed"], "answer": 2}, {"q": "Which part holds the plant in soil?", "options": ["Leaf", "Root", "Flower", "Fruit"], "answer": 1}], "fillBlanks": ["Leaves make food using ______. (sunlight)"], "trueFalse": ["Flowers become fruits. (True)"], "oneWord": ["Which part carries water to leaves? — Stem"], "videoQuery": "Plants and Their Parts class 4 Science Maharashtra Balbharati"},"4|Science|Animals and Their Habitats":{"overview": "Where animals live and how they adapt.", "notes": "The place where an animal lives is its habitat. Fish live in water, camels in deserts, polar bears in cold regions. Animals have body parts that help them survive, called adaptations, like a camel's hump and a bird's wings.", "points": ["Habitat is the animal's home.", "Adaptations help survival.", "Different animals, different habitats."], "words": [{"word": "Habitat", "meaning": "The natural home of an animal."}, {"word": "Adaptation", "meaning": "A feature that helps an animal survive."}], "mcqs": [{"q": "A camel lives in a ______.", "options": ["desert", "pond", "forest", "ice"], "answer": 0}, {"q": "Fish live in?", "options": ["Water", "Trees", "Sand", "Air"], "answer": 0}], "fillBlanks": ["A bird's wings help it ______. (fly)"], "trueFalse": ["A polar bear lives in cold regions. (True)"], "oneWord": ["Where does a fish live? — Water"], "videoQuery": "Animals and Their Habitats class 4 Science Maharashtra Balbharati"},"4|Science|Our Senses":{"overview": "The five senses and how they work.", "notes": "We have five senses: sight (eyes), hearing (ears), smell (nose), taste (tongue) and touch (skin). These sense organs send messages to the brain. We should protect our eyes and ears from damage.", "points": ["Five sense organs.", "Messages go to the brain.", "Protect eyes and ears."], "words": [{"word": "Sense organ", "meaning": "A body part that senses things."}, {"word": "Brain", "meaning": "The organ that controls the body."}], "mcqs": [{"q": "Which organ helps us hear?", "options": ["Eye", "Ear", "Nose", "Skin"], "answer": 1}, {"q": "The sense of touch is felt by?", "options": ["Skin", "Tongue", "Eye", "Ear"], "answer": 0}], "fillBlanks": ["We taste with our ______. (tongue)"], "trueFalse": ["The brain receives messages from sense organs. (True)"], "oneWord": ["How many senses do we have? — Five"], "videoQuery": "Our Senses class 4 Science Maharashtra Balbharati"},"4|Science|Food and Nutrition":{"overview": "Nutrients and a balanced diet.", "notes": "Food gives energy and helps growth. Main nutrients: carbohydrates (energy), proteins (growth), fats, vitamins and minerals. A balanced diet has all nutrients. We should eat fruits, vegetables, pulses, milk and cereals, and avoid too much junk food.", "points": ["Proteins help growth.", "Carbohydrates give energy.", "Eat a balanced diet."], "words": [{"word": "Nutrient", "meaning": "A useful substance in food."}, {"word": "Balanced diet", "meaning": "Food with all nutrients in the right amount."}], "mcqs": [{"q": "Which gives energy?", "options": ["Carbohydrates", "Water only", "Salt", "Air"], "answer": 0}, {"q": "Which food is rich in protein?", "options": ["Dal", "Sugar", "Oil", "Candy"], "answer": 0}], "fillBlanks": ["Proteins help our body ______. (grow)"], "trueFalse": ["Junk food should be limited. (True)"], "oneWord": ["Which nutrient gives energy? — Carbohydrates"], "videoQuery": "Food and Nutrition class 4 Science Maharashtra Balbharati"},"4|Science|Water Cycle":{"overview": "How water moves between earth and sky.", "notes": "Heat from the Sun turns water from rivers and seas into vapour; this is evaporation. Vapour rises, cools and forms clouds; this is condensation. Water falls as rain; this is precipitation. The cycle repeats.", "points": ["Evaporation: water to vapour.", "Condensation: vapour to clouds.", "Rain returns the water."], "words": [{"word": "Evaporation", "meaning": "Water turning into vapour by heat."}, {"word": "Condensation", "meaning": "Vapour changing to tiny water drops."}], "mcqs": [{"q": "Water turns to vapour by?", "options": ["Cold", "Heat", "Wind only", "Soil"], "answer": 1}, {"q": "Clouds form by?", "options": ["Evaporation", "Condensation", "Melting", "Digging"], "answer": 1}], "fillBlanks": ["Rain is also called ______. (precipitation)"], "trueFalse": ["The Sun's heat drives the water cycle. (True)"], "oneWord": ["What do clouds contain? — Tiny water drops"], "videoQuery": "Water Cycle class 4 Science Maharashtra Balbharati"},"4|Science|Air and Wind":{"overview": "Air, its properties and wind.", "notes": "Air is a mixture of gases like oxygen and nitrogen. It surrounds the earth, takes up space and has weight. Moving air is wind. Wind helps in flying kites, windmills and drying clothes. Living things need oxygen.", "points": ["Air is a mixture of gases.", "Wind is moving air.", "Oxygen is needed to breathe."], "words": [{"word": "Oxygen", "meaning": "The gas we need to breathe."}, {"word": "Wind", "meaning": "Moving air."}], "mcqs": [{"q": "We breathe in ______.", "options": ["Oxygen", "Smoke", "Dust", "Water"], "answer": 0}, {"q": "Moving air is called?", "options": ["Wind", "Dew", "Fog", "Rain"], "answer": 0}], "fillBlanks": ["Air takes up ______. (space)"], "trueFalse": ["Wind runs windmills. (True)"], "oneWord": ["Which gas do we need to breathe? — Oxygen"], "videoQuery": "Air and Wind class 4 Science Maharashtra Balbharati"},"4|Science|Soil and Rocks":{"overview": "Types of soil, rocks and their uses.", "notes": "Soil forms when rocks break down over a long time. Types are sandy, clayey and loamy; loamy soil is best for crops. Rocks are hard and are used to build houses and roads. Soil erosion should be prevented by planting trees.", "points": ["Soil comes from rocks.", "Loamy soil is good for crops.", "Trees stop soil erosion."], "words": [{"word": "Erosion", "meaning": "Washing or blowing away of soil."}, {"word": "Loamy soil", "meaning": "A mix of sand and clay good for plants."}], "mcqs": [{"q": "Which soil is best for crops?", "options": ["Loamy", "Sandy", "Rocky", "Dry"], "answer": 0}, {"q": "Soil is formed from?", "options": ["Rocks", "Plastic", "Glass", "Metal"], "answer": 0}], "fillBlanks": ["Planting trees stops soil ______. (erosion)"], "trueFalse": ["Rocks are used to build roads. (True)"], "oneWord": ["Which soil is best for crops? — Loamy soil"], "videoQuery": "Soil and Rocks class 4 Science Maharashtra Balbharati"},"4|Science|Light and Shadows":{"overview": "Sources of light and how shadows form.", "notes": "Light comes from sources like the Sun, lamps and fire. Light travels in a straight line. When an opaque object blocks light, a shadow forms. Transparent things let light pass, translucent let some pass, opaque let none pass.", "points": ["Light travels straight.", "Opaque objects make shadows.", "Sun is the main source of light."], "words": [{"word": "Opaque", "meaning": "Does not allow light to pass."}, {"word": "Shadow", "meaning": "A dark shape formed when light is blocked."}], "mcqs": [{"q": "Which makes a shadow?", "options": ["Opaque object", "Clear glass", "Air", "Water"], "answer": 0}, {"q": "Light travels in a ______ line.", "options": ["Straight", "Curved", "Zigzag", "Circular"], "answer": 0}], "fillBlanks": ["The Sun is a natural source of ______. (light)"], "trueFalse": ["Glass is transparent. (True)"], "oneWord": ["What forms when light is blocked? — Shadow"], "videoQuery": "Light and Shadows class 4 Science Maharashtra Balbharati"},"4|Science|Sound":{"overview": "How sound is made and travels.", "notes": "Sound is made by vibration. It travels through air, water and solids but not through a vacuum. Sounds can be loud or soft, high or low. Too much noise is harmful, so we should avoid loud sounds.", "points": ["Vibration makes sound.", "Sound needs a medium.", "Avoid loud noise."], "words": [{"word": "Vibration", "meaning": "Fast to-and-fro movement."}, {"word": "Noise", "meaning": "Unpleasant loud sound."}], "mcqs": [{"q": "Sound is produced by?", "options": ["Vibration", "Light", "Heat", "Magnet"], "answer": 0}, {"q": "Sound cannot travel ai", "New Delhi", "Kolkata", "Chennai"], "answer": 1}, {"q": "India is in which continent?", "options": ["Africa", "Asia", "Europe", "Australia"], "answer": 1}], "fillBlanks": ["India is known for unity in ______. (diversity)"], "trueFalse": ["The Himalayas lie in the north of India. (True)"], "oneWord": ["How many states does India have? — 28"], "videoQuery": "Our Country India class 4 History Maharashtra Balbharati"},"4|History|Maps and Directions":{"overview": "Using maps, directions and symbols.", "notes": "A map shows a place on paper. The four main directions are north, south, east and west. Sub-directions: north-east, south-east, south-west and north-west. A map key explains the symbols; scale shows distances.", "points": ["Four main directions.", "Map key explains symbols.", "Scale shows distance."], "words": [{"word": "Map key", "meaning": "A list explaining map symbols."}, {"word": "Scale", "meaning": "Shows how distance on the map relates to real distance."}], "mcqs": [{"q": "The Sun rises in the?", "options": ["West", "East", "North", "South"], "answer": 1}, {"q": "Between north and east is?", "options": ["North-east", "South-west", "North-west", "South-east"], "answer": 0}], "fillBlanks": ["A map key explains the ______. (symbols)"], "trueFalse": ["North is opposite to south. (True)"], "oneWord": ["Which direction is opposite to east? — West"], "videoQuery": "Maps and Directions class 4 History Maharashtra Balbharati"},"4|History|Our State Maharashtra":{"overview": "Location, capital, regions and culture of Maharashtra.", "notes": "Maharashtra is in western India with the Arabian Sea on its west. Its capital is Mumbai and second capital Nagpur. Regions: Konkan, Desh, Marathwada, Vidarbha and Khandesh. Marathi is the language. Maharashtra Day is on 1 May.", "points": ["Capital: Mumbai.", "Regions: Konkan, Desh, Marathwada, Vidarbha, Khandesh.", "Maharashtra Day: 1 May."], "words": [{"word": "Region", "meaning": "A part of a state with common features."},
