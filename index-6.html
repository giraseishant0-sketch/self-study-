", "0.25", "0.05", "0.15"], "answer": 0}], "fillBlanks": ["1/100 = ______. (0.01)"], "trueFalse": ["0.5 is the same as 1/2. (True)"], "oneWord": ["What is 0.3 + 0.4? — 0.7"], "videoQuery": "Decimals class 5 Mathematics Maharashtra Balbharati"},"5|Mathematics|Angles and Shapes":{"overview": "Types of angles and properties of shapes.", "notes": "An angle is formed when two lines meet at a point. A right angle is 90°, an acute angle is less than 90° and an obtuse angle is between 90° and 180°. Triangles can be equilateral, isosceles or scalene. A protractor measures angles.", "points": ["Right angle = 90°.", "Acute < 90°, obtuse > 90°.", "Protractor measures angles."], "words": [{"word": "Acute angle", "meaning": "An angle less than 90°."}, {"word": "Protractor", "meaning": "A tool to measure angles."}], "mcqs": [{"q": "An angle of 120° is?", "options": ["Acute", "Right", "Obtuse", "Straight"], "answer": 2}, {"q": "A triangle with all sides equal is?", "options": ["Isosceles", "Scalene", "Equilateral", "Right"], "answer": 2}], "fillBlanks": ["A right angle measures ______ degrees. (90)"], "trueFalse": ["An acute angle is smaller than a right angle. (True)"], "oneWord": ["Which tool measures angles? — Protractor"], "videoQuery": "Angles and Shapes class 5 Mathematics Maharashtra Balbharati"},"5|Mathematics|Perimeter and Area":{"overview": "Calculating perimeter and area of squares and rectangles.", "notes": "Perimeter is the distance around a shape: rectangle = 2 × (l + b), square = 4 × side. Area is the space inside: rectangle = length × breadth, square = side × side. Area is in square units like cm².", "points": ["Perimeter: around.", "Area: inside, in square units.", "Area of rectangle = l × b."], "words": [{"word": "Area", "meaning": "The space covered by a shape."}, {"word": "Perimeter", "meaning": "The distance around a shape."}], "mcqs": [{"q": "Area of a rectangle 5 cm × 4 cm?", "options": ["9 cm²", "18 cm²", "20 cm²", "25 cm²"], "answer": 2}, {"q": "Perimeter of a square with side 6 cm?", "options": ["12 cm", "24 cm", "36 cm", "18 cm"], "answer": 1}], "fillBlanks": ["Area of a square with side 3 cm is ______ cm². (9)"], "trueFalse": ["Perimeter is measured in square units. (False)"], "oneWord": ["Formula for the area of a rectangle? — length × breadth"], "videoQuery": "Perimeter and Area class 5 Mathematics Maharashtra Balbharati"},"5|Mathematics|Time and Money":{"overview": "Time calculations, 24-hour clock, and money problems.", "notes": "There are 60 minutes in an hour and 24 hours in a day. The 24-hour clock avoids am and pm: 3 pm is 15:00. To find duration, subtract start time from end time. In money problems, add the cost and subtract from the amount paid to find change. Profit and loss compare cost price and selling price.", "points": ["24-hour clock: 1 pm = 13:00.", "Duration = end − start.", "Change = paid − cost."], "words": [{"word": "Duration", "meaning": "How long something lasts."}, {"word": "Profit", "meaning": "Gain when selling price is higher than cost price."}], "mcqs": [{"q": "5 pm in 24-hour clock is?", "options": ["15:00", "17:00", "19:00", "5:00"], "answer": 1}, {"q": "Cost ₹80, paid ₹100. Change?", "options": ["₹10", "₹20", "₹30", "₹40"], "answer": 1}], "fillBlanks": ["There are ______ minutes in an hour. (60)"], "trueFalse": ["6:30 pm is 18:30. (True)"], "oneWord": ["How many hours from 9 am to 2 pm? — 5"], "videoQuery": "Time and Money class 5 Mathematics Maharashtra Balbharati"},"5|Mathematics|Data Handling":{"overview": "Collecting data and reading tables, bar graphs and averages.", "notes": "Data is collected information. We can show it in tally marks, tables, pictographs and bar graphs. A bar graph uses bars of different heights. The average (mean) is the sum of values divided by their number. Always read the title and scale.", "points": ["Use tally marks to count.", "Bar graphs compare data.", "Average = sum ÷ number."], "words": [{"word": "Data", "meaning": "Collected information."}, {"word": "Average", "meaning": "Sum of values divided by the number of values."}], "mcqs": [{"q": "Average of 4, 6, 8?", "options": ["4", "6", "8", "18"], "answer": 1}, {"q": "Which shows data with bars?", "options": ["Bar graph", "Map", "Clock", "Calendar"], "answer": 0}], "fillBlanks": ["The average of 2 and 4 is ______. (3)"], "trueFalse": ["Tally marks help in counting. (True)"], "oneWord": ["What do we divide the sum by to get the average? — Number of values"], "videoQuery": "Data Handling class 5 Mathematics Maharashtra Balbharati"},"5|Science|Living World":{"overview": "Classification of living things and their characteristics.", "notes": "Living things breathe, grow, reproduce and respond. They are classified into plants and animals; animals into vertebrates (with backbone) and invertebrates. Living things show adaptation to their surroundings and depend on each other in food chains.", "points": ["Vertebrates have a backbone.", "Living things adapt.", "Food chains link living things."], "words": [{"word": "Vertebrate", "meaning": "An animal with a backbone."}, {"word": "Adaptation", "meaning": "A feature that helps survival."}], "mcqs": [{"q": "Which is a vertebrate?", "options": ["Earthworm", "Fish", "Snail", "Butterfly"], "answer": 1}, {"q": "Plants make food by?", "options": ["Photosynthesis", "Digestion", "Respiration", "Evaporation"], "answer": 0}], "fillBlanks": ["Animals with a backbone are ______. (vertebrates)"], "trueFalse": ["Food chains show who eats whom. (True)"], "oneWord": ["Which animal group has no backbone? — Invertebrates"], "videoQuery": "Living World class 5 Science Maharashtra Balbharati"},"5|Science|Plants":{"overview": "Parts of a plant, photosynthesis and reproduction.", "notes": "Roots absorb water and minerals; the stem supports and carries water; leaves make food by photosynthesis using sunlight, water and carbon dioxide. Flowers make fruits and seeds, and seeds grow into new plants. Seeds spread by wind, water and animals.", "points": ["Photosynthesis needs sunlight, water, CO₂.", "Flowers produce seeds.", "Seeds disperse in many ways."], "words": [{"word": "Photosynthesis", "meaning": "Making food using sunlight."}, {"word": "Dispersal", "meaning": "Spreading of seeds."}], "mcqs": [{"q": "Which gas do plants take in?", "options": ["Oxygen", "Carbon dioxide", "Nitrogen", "Hydrogen"], "answer": 1}, {"q": "Which part makes food?", "options": ["Leaf", "Root", "Seed", "Stem"], "answer": 0}], "fillBlanks": ["Leaves make food in the presence of ______. (sunlight)"], "trueFalse": ["Seeds can be spread by wind. (True)"], "oneWord": ["Which gas is released by plants during photosynthesis? — Oxygen"], "videoQuery": "Plants class 5 Science Maharashtra Balbharati"},"5|Science|Animals":{"overview": "Animal groups, habitats, food habits and life cycles.", "notes": "Animals are herbivores, carnivores or omnivores depending on food. They live in different habitats like forests, oceans and deserts. Life cycles show stages: butterfly goes egg → larva → pupa → adult, and a frog goes egg → tadpole → adult. Some animals hibernate or migrate.", "points": ["Herbivores, carnivores, omnivores.", "Butterfly: complete metamorphosis.", "Migration and hibernation."], "words": [{"word": "Habitat", "meaning": "An animal's natural home."}, {"word": "Metamorphosis", "meaning": "Change of form during life cycle."}], "mcqs": [{"q": "A frog's young one is called?", "options": ["Larva", "Tadpole", "Pupa", "Chick"], "answer": 1}, {"q": "A lion is a?", "options": ["Herbivore", "Carnivore", "Omnivore", "Producer"], "answer": 1}], "fillBlanks": ["An animal that eats both plants and animals is an ______. (omnivore)"], "trueFalse": ["A tadpole grows into a frog. (True)"], "oneWord": ["Name the stage after the caterpillar. — Pupa"], "videoQuery": "Animals class 5 Science Maharashtra Balbharati"},"5|Science|Human Body Systems":{"overview": "Digestive, respiratory, circulatory and skeletal systems.", "notes": "The digestive system breaks down food; the respiratory system takes in oxygen through the lungs; the circulatory system pumps blood with the heart; the skeletal system gives shape and protects organs with 206 bones in an adult. Muscles help movement.", "points": ["Heart pumps blood.", "Lungs help breathing.", "Adults have 206 bones."], "words": [{"word": "Digestion", "meaning": "Breaking down food."}, {"word": "Circulation", "meaning": "Movement of blood."}], "mcqs": [{"q": "Which organ pumps blood?", "options": ["Lungs", "Heart", "Liver", "Brain"], "answer": 1}, {"q": "How many bones in an adult?", "options": ["106", "206", "306", "406"], "answer": 1}], "fillBlanks": ["We breathe through the ______. (lungs)"], "trueFalse": ["The stomach is part of the digestive system. (True)"], "oneWord": ["Which organ controls the body? — Brain"], "videoQuery": "Human Body Systems class 5 Science Maharashtra Balbharati"},"5|Science|Food and Nutrition":{"overview": "Nutrients, balanced diet and deficiency diseases.", "notes": "Nutrients are carbohydrates, proteins, fats, vitamins, minerals and water. A balanced diet has all in the right amount. Lack of a nutrient causes deficiency diseases: lack of Vitamin C causes scurvy and of iron causes anaemia. Food must be stored and cooked hygienically.", "points": ["Balanced diet includes all nutrients.", "Vitamin C deficiency: scurvy.", "Hygienic food handling."], "words": [{"word": "Nutrient", "meaning": "A useful part of food."}, {"word": "Deficiency", "meaning": "Lack of something needed."}], "mcqs": [{"q": "Lack of Vitamin C causes?", "options": ["Scurvy", "Rickets", "Night blindness", "Goitre"], "answer": 0}, {"q": "Which gives energy?", "options": ["Carbohydrates", "Water", "Minerals", "Vitamins"], "answer": 0}], "fillBlanks": ["Proteins help in body ______. (growth)"], "trueFalse": ["A balanced diet is healthy. (True)"], "oneWord": ["Which disease is caused by iron deficiency? — Anaemia"], "videoQuery": "Food and Nutrition class 5 Science Maharashtra Balbharati"},"5|Science|Matter and Materials":{"overview": "States of matter and properties of materials.", "notes": "Matter is anything that has weight and takes up space. It exists as solid, liquid and gas. Solids keep their shape, liquids take the shape of the container and gases spread everywhere. Heating and cooling change states: melting, freezing, evaporation and condensation. Materials may be hard or soft, transparent or opaque.", "points": ["Three states of matter.", "Melting, freezing, evaporation.", "Materials have properties."], "words": [{"word": "Matter", "meaning": "Anything that has weight and takes space."}, {"word": "Melting", "meaning": "Solid changing to liquid."}], "mcqs": [{"q": "Ice changing to water is?", "options": ["Melting", "Freezing", "Evaporation", "Condensation"], "answer": 0}, {"q": "Which state keeps its shape?", "options": ["Solid", "Liquid", "Gas", "Vapour"], "answer": 0}], "fillBlanks": ["Water in gas form is called ______. (vapour)"], "trueFalse": ["Liquids take the shape of their container. (True)"], "oneWord": ["What is the change of liquid to gas called? — Evaporation"], "videoQuery": "Matter and Materials class 5 Science Maharashtra Balbharati"},"5|Science|Force and Energy":{"overview": "Push, pull, friction, gravity and forms of energy.", "notes": "A force is a push or a pull. It can move, stop or change the shape of an object. Friction opposes motion and gravity pulls objects towards the earth. Energy is the ability to do work: heat, light, sound, electrical and mechanical energy. Energy changes from one form to another.", "points": ["Force: push or pull.", "Gravity pulls down.", "Energy changes form."], "words": [{"word": "Force", "meaning": "A push or pull."}, {"word": "Friction", "meaning": "A force that opposes motion."}], "mcqs": [{"q": "What pulls objects to the earth?", "options": ["Friction", "Gravity", "Magnet", "Wind"], "answer": 1}, {"q": "A push or pull is a?", "options": ["Force", "Energy", "Heat", "Sound"], "answer": 0}], "fillBlanks": ["The force that pulls things down is ______. (gravity)"], "trueFalse": ["Friction slows moving objects. (True)"], "oneWord": ["Name a form of energy. — Heat"], "videoQuery": "Force and Energy class 5 Science Maharashtra Balbharati"},"5|Science|Light and Sound":{"overview": "How light and sound travel and their properties.", "notes": "Light travels in straight lines and can be reflected by mirrors. Transparent, translucent and opaque objects behave differently with light; opaque objects form shadows. Sound is made by vibrations and needs a medium to travel; it cannot travel in a vacuum. Pitch decides high or low sound.", "points": ["Light travels straight.", "Mirrors reflect light.", "Sound needs a medium."], "words": [{"word": "Reflection", "meaning": "Bouncing back of light."}, {"word": "Pitch", "meaning": "How high or low a sound is."}], "mcqs": [{"q": "Which makes a shadow?", "options": ["Opaque object", "Transparent glass", "Air", "Water"], "answer": 0}, {"q": "Sound cannot travel through?", "options": ["Air", "Water", "Vacuum", "Iron"], "answer": 2}], "fillBlanks": ["Light travels in a ______ line. (straight)"], "trueFalse": ["Sound is produced by vibration. (True)"], "oneWord": ["What bounces light back? — Mirror"], "videoQuery": "Light and Sound class 5 Science Maharashtra Balbharati"},"5|Science|Earth and Space":{"overview": "The Sun, planets, Moon and Earth's motions.", "notes": "The Sun is a star at the centre of the solar system with eight planets going around it. Earth rotates on its axis in 24 hours, causing day and night, and revolves around the Sun in about 365 days, causing seasons. The Moon revolves around Earth and shows phases.", "points": ["Eight planets.", "Rotation causes day and night.", "Revolution takes 365 days."], "words": [{"word": "Rotation", "meaning": "Earth turning on its axis."}, {"word": "Revolution", "meaning": "Earth going around the Sun."}], "mcqs": [{"q": "How many planets in the solar system?", "options": ["7", "8", "9", "10"], "answer": 1}, {"q": "Rotation causes?", "options": ["Seasons", "Day and night", "Tides only", "Eclipses only"], "answer": 1}], "fillBlanks": ["The Earth takes about ______ days to go around the Sun. (365)"], "trueFalse": ["The Moon revolves around the Earth. (True)"], "oneWord": ["Which star is at the centre of the solar system? — The Sun"], "videoQuery": "Earth and Space class 5 Science Maharashtra Balbharati"},"5|Science|Water and Air":{"overview": "Sources of water, pollution and air composition.", "notes": "Water comes from rain, rivers, wells and lakes. We should purify it by boiling or filtering. Air is a mixture of nitrogen (about 78%), oxygen (about 21%) and other gases. Pollution makes air and water unsafe, so we must save water and reduce smoke.", "points": ["Boil or filter water.", "Air: nitrogen and oxygen mainly.", "Prevent pollution."], "words": [{"word": "Pollution", "meaning": "Making air or water dirty."}, {"word": "Purify", "meaning": "To make clean."}], "mcqs": [{"q": "Most of the air is?", "options": ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"], "answer": 1}, {"q": "How can we purify water?", "options": ["Boil it", "Add soil", "Leave it open", "Add plastic"], "answer": 0}], "fillBlanks": ["Air is mostly ______. (nitrogen)"], "trueFalse": ["We should not waste water. (True)"], "oneWord": ["Which gas do we breathe in? — Oxygen"], "videoQuery": "Water and Air class 5 Science Maharashtra Balbharati"},"5|Science|Natural Resources":{"overview": "Types of resources and their conservation.", "notes": "Natural resources come from nature: soil, water, air, forests, minerals and fossil fuels. Renewable resources like sunlight and wind can be reused; non-renewable resources like coal and petroleum get used up. We must conserve resources by saving water, planting trees and using solar energy.", "points": ["Renewable and non-renewable.", "Fossil fuels are non-renewable.", "Conserve resources."], "words": [{"word": "Renewable", "meaning": "Can be replaced naturally."}, {"word": "Fossil fuel", "meaning": "Coal, petrol and natural gas formed from ancient remains."}], "mcqs": [{"q": "Which is renewable?", "options": ["Coal", "Petrol", "Solar energy", "Diesel"], "answer": 2}, {"q": "Which is a fossil fuel?", "options": ["Wind", "Coal", "Water", "Sunlight"], "answer": 1}], "fillBlanks": ["Coal and petroleum are ______ resources. (non-renewable)"], "trueFalse": ["Planting trees helps conserve resources. (True)"], "oneWord": ["Name a renewable source of energy. — Sunlight"], "videoQuery": "Natural Resources class 5 Science Maharashtra Balbharati"},"5|Geography|Our Earth":{"overview": "Shape of the earth, its motions and the globe.", "notes": "The earth is nearly round and is shown on a model called a globe. The earth rotates on its axis in 24 hours, causing day and night, and revolves around the Sun in about 365 days, causing seasons. The imaginary line around the middle is the equator.", "points": ["Earth is nearly round.", "Rotation: day and night.", "Revolution: seasons."], "words": [{"word": "Axis", "meaning": "An imaginary line through the earth's poles."}, {"word": "Equator", "meaning": "Imaginary line dividing the earth into two halves."}], "mcqs": [{"q": "How long does the earth take to rotate once?", "options": ["12 hours", "24 hours", "365 days", "7 days"], "answer": 1}, {"q": "What causes day and night?", "options": ["Rotation", "Revolution", "Moon", "Wind"], "answer": 0}], "fillBlanks": ["The earth's spinning on its axis is called ______. (rotation)"], "trueFalse": ["The earth is the third planet from the Sun. (True)"], "oneWord": ["What is a model of the earth called? — Globe"], "videoQuery": "Our Earth class 5 Geography Maharashtra Balbharati"},"5|Geography|Land and Water":{"overview": "Landforms and water bodies.", "notes": "About 71% of the earth is covered with water and 29% with land. Landforms include mountains, plateaus, plains and valleys. Water appears as rivers, lakes, seas and oceans.", "points": ["71% water, 29% land.", "Mountains, plateaus, plains, valleys.", "Rivers, lakes, seas, oceans."], "words": [{"word": "Plateau", "meaning": "A raised flat land."}, {"word": "Plain", "meaning": "A wide flat land."}], "mcqs": [{"q": "How much of the earth is water?", "options": ["29%", "50%", "71%", "10%"], "answer": 2}, {"q": "Which is a landform?", "options": ["River", "Mountain", "Sea", "Lake"], "answer": 1}], "fillBlanks": ["A wide flat land is called a ______. (plain)"], "trueFalse": ["Oceans are larger than seas. (True)"], "oneWord": ["Which is bigger — land or water? — Water"], "videoQuery": "Land and Water class 5 Geography Maharashtra Balbharati"},"5|Geography|Maps and Directions":{"overview": "Reading maps, directions and symbols.", "notes": "A map is a drawing of the earth or a part of it on paper. The main directions are north, south, east and west; the in-between ones are north-east, south-east, south-west and north-west. A map key explains symbols and the scale shows distances.", "points": ["Four main directions.", "Map key explains symbols.", "Scale shows distance."], "words": [{"word": "Map key", "meaning": "The list explaining map symbols."}, {"word": "Scale", "meaning": "Shows how map distance relates to real distance."}], "mcqs": [{"q": "The Sun rises in the?", "options": ["East", "West", "North", "South"], "answer": 0}, {"q": "Between north and east?", "options": ["North-east", "South-west", "South-east", "North-west"], "answer": 0}], "fillBlanks": ["A map ______ explains symbols. (key)"], "trueFalse": ["North is opposite to south. (True)"], "oneWord": ["What direction is opposite to west? — East"], "videoQuery": "Maps and Directions class 5 Geography Maharashtra Balbharati"},"5|Geography|Continents and Oceans":{"overview": "Seven continents and five oceans.", "notes": "The earth has seven continents: Asia, Africa, North America, South America, Antarctica, Europe and Australia. Asia is the largest. The five oceans are the Pacific, Atlantic, Indian, Southern and Arctic. The Pacific is the largest.", "points": ["Seven continents.", "Asia is the largest.", "Pacific is the largest ocean."], "words": [{"word": "Continent", "meaning": "A very large landmass."}, {"word": "Ocean", "meaning": "A huge body of salt water."}], "mcqs": [{"q": "Largest continent?", "options": ["Africa", "Asia", "Europe", "Australia"], "answer": 1}, {"q": "Largest ocean?", "options": ["Indian", "Atlantic", "Pacific", "Arctic"], "answer": 2}], "fillBlanks": ["India lies in the continent of ______. (Asia)"], "trueFalse": ["There are five oceans. (True)"], "oneWord": ["How many continents are there? — Seven"], "videoQuery": "Continents and Oceans class 5 Geography Maharashtra Balbharati"},"5|Geography|India — Location and States":{"overview": "India's location, neighbours and states.", "notes": "India lies in the northern and eastern hemispheres in Asia. It has 28 states and 8 union territories, with New Delhi as the capital. Its neighbours include Pakistan, China, Nepal, Bhutan, Bangladesh and Myanmar. The Indian Ocean lies to the south.", "points": ["28 states, 8 UTs.", "Capital: New Delhi.", "Indian Ocean in the south."], "words": [{"word": "State", "meaning": "A division of India with its own government."}, {"word": "Neighbour", "meaning": "A nearby country."}], "mcqs": [{"q": "Capital of India?", "options": ["Mumbai", "New Delhi", "Chennai", "Kolkata"], "answer": 1}, {"q": "Which ocean is south of India?", "options": ["Pacific", "Indian", "Atlantic", "Arctic"], "answer": 1}], "fillBlanks": ["The capital of Maharashtra is ______. (Mumbai)"], "trueFalse": ["Nepal is a neighbour of India. (True)"], "oneWord": ["How many states does India have? — 28"], "videoQuery": "India — Location and States class 5 Geography Maharashtra Balbharati"},"5|Geography|Climate and Seasons":{"overview": "Weather, climate and seasons in India.", "notes": "Weather is the daily condition of the air; climate is its average over many years. India has summer, monsoon and winter seasons. The monsoon winds bring rain from June to September and farming depends on them.", "points": ["Weather vs climate.", "Three main seasons.", "Monsoon brings rain."], "words": [{"word": "Climate", "meaning": "Average weather over many years."}, {"word": "Monsoon", "meaning": "Seasonal winds bringing rain."}], "mcqs": [{"q": "Monsoon rains come in?", "options": ["June–September", "December–February", "March–May", "None"], "answer": 0}, {"q": "Number of main seasons in India?", "options": ["2", "3", "4", "6"], "answer": 1}], "fillBlanks": ["Winter is the ______ season. (cold)"], "trueFalse": ["Weather changes day to day. (True)"], "oneWord": ["Which winds bring rain to India? — Monsoon winds"], "videoQuery": "Climate and Seasons class 5 Geography Maharashtra Balbharati"},"5|Geography|Rivers and Mountains of India":{"overview": "Major mountains and rivers.", "notes": "The Himalayas lie in the north and include Mount Everest, the world's highest peak. The Sahyadri lies along the west coast. Rivers Ganga, Yamuna and Brahmaputra begin in the Himalayas and flow all year. The Godavari is the longest river of south India. Rivers give water, fertile soil and power.", "points": ["Himalayas in the north.", "Himalayan rivers flow all year.", "Godavari: longest in south India."], "words": [{"word": "Source", "meaning": "Where a river begins."}, {"word": "Perennial", "meaning": "Flowing throughout the year."}], "mcqs": [{"q": "Highest peak of the world?", "options": ["K2", "Everest", "Kanchenjunga", "Annapurna"], "answer": 1}, {"q": "Which river begins in the Himalayas?", "options": ["Godavari", "Ganga", "Krishna", "Kaveri"], "answer": 1}], "fillBlanks": ["The Sahyadri mountains lie on the ______ coast. (west)"], "trueFalse": ["The Ganga is a Himalayan river. (True)"], "oneWord": ["Longest river of south India? — Godavari"], "videoQuery": "Rivers and Mountains of India class 5 Geography Maharashtra Balbharati"},"5|Geography|Natural Resources":{"overview": "Types of natural resources and conservation.", "notes": "Natural resources like soil, water, air, forests and minerals come from nature. Renewable resources like sunlight and wind can be used again; non-renewable ones like coal and petroleum get used up. We must use them wisely.", "points": ["Renewable vs non-renewable.", "Save water and fuel.", "Plant trees."], "words": [{"word": "Resource", "meaning": "Something useful from nature."}, {"word": "Mineral", "meaning": "A natural substance from the earth."}], "mcqs": [{"q": "Which is non-renewable?", "options": ["Wind", "Sunlight", "Coal", "Rain"], "answer": 2}, {"q": "Which is renewable?", "options": ["Petrol", "Coal", "Solar energy", "Diesel"], "answer": 2}], "fillBlanks": ["Coal is a ______ resource. (non-renewable)"], "trueFalse": ["Wind energy is renewable. (True)"], "oneWord": ["Name a mineral. — Coal"], "videoQuery": "Natural Resources class 5 Geography Maharashtra Balbharati"},"5|Geography|Our Environment":{"overview": "Components of environment, pollution and protection.", "notes": "The environment is everything around us: land, water, air, plants, animals and people. Pollution harms it. We can protect it by planting trees, saving water, reducing waste and recycling. World Environment Day is 5 June.", "points": ["Pollution harms nature.", "Reduce, reuse, recycle.", "World Environment Day: 5 June."], "words": [{"word": "Environment", "meaning": "Everything around us."}, {"word": "Recycle", "meaning": "To make new things from used ones."}], "mcqs": [{"q": "World Environment Day is on?", "options": ["5 June", "15 August", "26 January", "2 October"], "answer": 0}, {"q": "Which helps the environment?", "options": ["Planting trees", "Littering", "Burning plastic", "Wasting water"], "answer": 0}], "fillBlanks": ["The 3 Rs are Reduce, Reuse and ______. (Recycle)"], "trueFalse": ["Pollution harms the environment. (True)"], "oneWord": ["When is World Environment Day? — 5 June"], "videoQuery": "Our Environment class 5 Geography Maharashtra Balbharati"},"5|History|Sources of History":{"overview": "Written, material and oral sources of history.", "notes": "History is the study of the past. Its sources are written (inscriptions, books), material (coins, tools, forts, temples) and oral (folk songs, stories, powadas). Historians study them to learn about the past.", "points": ["Three types of sources.", "Coins and inscriptions help.", "Oral sources include powadas."], "words": [{"word": "Inscription", "meaning": "Writing carved on stone or metal."}, {"word": "Archaeology", "meaning": "Study of the past through remains."}], "mcqs": [{"q": "A coin is which source?", "options": ["Written", "Material", "Oral", "None"], "answer": 1}, {"q": "A powada is an?", "options": ["Oral source", "Material source", "Map", "Tool"], "answer": 0}], "fillBlanks": ["The study of the past is called ______. (history)"], "trueFalse": ["Forts are material sources. (True)"], "oneWord": ["What is writing carved on stone called? — Inscription"], "videoQuery": "Sources of History class 5 History Maharashtra Balbharati"},"5|History|Early Humans":{"overview": "Life of early humans in the Stone Age.", "notes": "Early humans lived in caves and hunted animals, gathered fruits and roots. They used stone tools, so this age is the Stone Age. The discovery of fire helped them cook and stay safe. Later, the wheel and farming made them settle in villages.", "points": ["Early humans used stone tools.", "Fire was a key discovery.", "Farming led to villages."], "words": [{"word": "Stone Age", "meaning": "Period when humans used stone tools."}, {"word": "Hunter-gatherer", "meaning": "A person who hunts and collects food."}], "mcqs": [{"q": "Early humans lived in?", "options": ["Caves", "Flats", "Palaces", "Huts of brick"], "answer": 0}, {"q": "Which discovery helped cook food?", "options": ["Fire", "Wheel", "Plough", "Coin"], "answer": 0}], "fillBlanks": ["The age of stone tools is the ______ Age. (Stone)"], "trueFalse": ["Early humans first did farming. (False)"], "oneWord": ["What discovery made them settle? — Farming"], "videoQuery": "Early Humans class 5 History Maharashtra Balbharati"},"5|History|Indus Valley Civilisation":{"overview": "City planning and life of the Indus people.", "notes": "The Indus Valley Civilisation grew about 5,000 years ago along the Indus river. Harappa and Mohenjo-daro were major cities with straight roads, brick houses and drains. People farmed, traded and made pottery and jewellery. Seals show their writing.", "points": ["Cities: Harappa, Mohenjo-daro.", "Brick houses and drains.", "Trade and seals."], "words": [{"word": "Civilisation", "meaning": "An advanced society with cities."}, {"word": "Excavation", "meaning": "Digging to find old remains."}], "mcqs": [{"q": "Which was an Indus city?", "options": ["Mohenjo-daro", "Pataliputra", "Ujjain", "Mathura"], "answer": 0}, {"q": "Houses were made of?", "options": ["Baked bricks", "Ice", "Cloth", "Grass only"], "answer": 0}], "fillBlanks": ["The Indus civilisation was found by ______. (excavation)"], "trueFalse": ["Indus cities had drains. (True)"], "oneWord": ["Name one Indus city. — Harappa"], "videoQuery": "Indus Valley Civilisation class 5 History Maharashtra Balbharati"},"5|History|Vedic Period":{"overview": "Society and learning in the Vedic age.", "notes": "In the Vedic period people lived near the Saraswati and Indus rivers. Knowledge was kept in four Vedas: Rig, Yajur, Sama and Atharva. Farming and cattle rearing were main occupations. Students learnt in gurukuls.", "points": ["Four Vedas.", "Rigveda is the oldest.", "Gurukul education."], "words": [{"word": "Veda", "meaning": "Ancient Indian texts of knowledge."}, {"word": "Gurukul", "meaning": "School where students lived with the teacher."}], "mcqs": [{"q": "How many Vedas?", "options": ["2", "3", "4", "5"], "answer": 2}, {"q": "Students learnt in?", "options": ["Gurukul", "Mall", "Factory", "Airport"], "answer": 0}], "fillBlanks": ["The oldest Veda is the ______. (Rigveda)"], "trueFalse": ["Farming was an occupation in the Vedic period. (True)"], "oneWord": ["Name the four Vedas. — Rig, Yajur, Sama, Atharva"], "videoQuery": "Vedic Period class 5 History Maharashtra Balbharati"},"5|History|Maurya Empire":{"overview": "Chandragupta Maurya and Ashoka.", "notes": "Chandragupta Maurya founded the Maurya Empire with the help of Chanakya, with Pataliputra as capital. Emperor Ashoka, after the Kalinga war, accepted Buddhism and spread peace and non-violence. He set up pillars and edicts across his empire.", "points": ["Founder: Chandragupta Maurya.", "Capital: Pataliputra.", "Ashoka accepted Buddhism."], "words": [{"word": "Empire", "meaning": "Many lands ruled by one emperor."}, {"word": "Edict", "meaning": "An official order carved on stone."}], "mcqs": [{"q": "Capital of the Maurya Empire?", "options": ["Delhi", "Pataliputra", "Ujjain", "Mathura"], "answer": 1}, {"q": "After which war did Ashoka change?", "options": ["Kalinga", "Panipat", "Plassey", "Haldighati"], "answer": 0}], "fillBlanks": ["Chanakya helped ______. (Chandragupta Maurya)"], "trueFalse": ["Ashoka spread non-violence. (True)"], "oneWord": ["Who founded the Maurya Empire? — Chandragupta Maurya"], "videoQuery": "Maurya Empire class 5 History Maharashtra Balbharati"},"5|History|Gupta Period":{"overview": "Gupta rulers and the golden age.", "notes": "The Gupta Empire had Pataliputra as capital. Samudragupta and Chandragupta II were great rulers. This was a golden age for art, literature and science. Kalidasa wrote poems and plays, Aryabhata worked in mathematics and astronomy, and the Delhi Iron Pillar shows metal skill.", "points": ["Gupta age is a golden age.", "Kalidasa and Aryabhata.", "Delhi Iron Pillar."], "words": [{"word": "Golden age", "meaning": "A time of great progress."}, {"word": "Astronomy", "meaning": "Study of stars and planets."}], "mcqs": [{"q": "Gupta age is called?", "options": ["Golden age", "Stone Age", "Dark age", "Iron age"], "answer": 0}, {"q": "Who was a poet of the Gupta age?", "options": ["Kalidasa", "Tulsidas", "Kabir", "Mirabai"], "answer": 0}], "fillBlanks": ["Aryabhata was a ______. (mathematician)"], "trueFalse": ["The Delhi Iron Pillar is from the Gupta period. (True)"], "oneWord": ["Which poet lived in the Gupta age? — Kalidasa"], "videoQuery": "Gupta Period class 5 History Maharashtra Balbharati"},"5|History|Ancient Indian Science and Culture":{"overview": "Scientists, medicine and art of ancient India.", "notes": "Aryabhata contributed to mathematics and astronomy. Sushruta is called the father of surgery, and Charaka wrote on Ayurveda. Varahamihira studied astronomy. Ajanta and Ellora caves show ancient sculpture and painting and are in Maharashtra.", "points": ["Aryabhata: maths and astronomy.", "Sushruta: surgery.", "Ajanta–Ellora caves."], "words": [{"word": "Surgery", "meaning": "Treating illness by operating."}, {"word": "Cave art", "meaning": "Paintings and sculptures in caves."}], "mcqs": [{"q": "Father of surgery?", "options": ["Charaka", "Sushruta", "Aryabhata", "Varahamihira"], "answer": 1}, {"q": "Ajanta caves are in?", "options": ["Maharashtra", "Gujarat", "Bihar", "Kerala"], "answer": 0}], "fillBlanks": ["Charaka wrote about ______. (Ayurveda)"], "trueFalse": ["Varahamihira studied astronomy. (True)"], "oneWord": ["Who is the father of surgery? — Sushruta"], "videoQuery": "Ancient Indian Science and Culture class 5 History Maharashtra Balbharati"},"5|History|Our Government and Citizens' Duties":{"overview": "Democracy, Constitution and duties.", "notes": "India is a democracy. The Constitution came into force on 26 January 1950, and Dr. B. R. Ambedkar chaired its drafting committee. Government works at three levels: central, state and local. Citizens must respect the Constitution, the national flag and public property, and vote after age 18.", "points": ["Constitution: 26 January 1950.", "Three levels of government.", "Citizens have duties."], "words": [{"word": "Democracy", "meaning": "Government chosen by the people."}, {"word": "Constitution", "meaning": "The supreme law of the country."}], "mcqs": [{"q": "Constitution came into force on?", "options": ["15 Aug 1947", "26 Jan 1950", "2 Oct 1948", "1 May 1960"], "answer": 1}, {"q": "Who chaired the drafting committee?", "options": ["Ambedkar", "Nehru", "Gandhi", "Patel"], "answer": 0}], "fillBlanks": ["India is a ______ country. (democratic)"], "trueFalse": ["Citizens should protect public property. (True)"], "oneWord": ["At what age can an Indian citizen vote? — 18"], "videoQuery": "Our Government and Citizens' Duties class 5 History Maharashtra Balbharati"},"6|Science|Force and Types of Force":{"overview": "What a force is and its main types.", "notes": "A force is a push or a pull. It can start or stop motion, change speed or direction, and change shape. Contact forces need touching (muscular force, friction); non-contact forces act from a distance (gravity, magnetic and electrostatic force). Force is measured in newtons (N).", "points": ["Force is a push or a pull.", "Friction opposes motion.", "Gravity pulls objects towards the earth.", "Unit of force: newton."], "words": [{"word": "Friction", "meaning": "A force that opposes motion between surfaces."}, {"word": "Gravitational force", "meaning": "The earth's pull on objects."}], "mcqs": [{"q": "Which is a non-contact force?", "options": ["Muscular", "Friction", "Gravitational", "Pushing a door"], "answer": 2}, {"q": "The unit of force is?", "options": ["Joule", "Newton", "Watt", "Metre"], "answer": 1}], "fillBlanks": ["A push or a pull is called a ______. (force)"], "trueFalse": ["Friction helps objects move faster. (False)"], "oneWord": ["Name the force that pulls objects down. — Gravity"], "videoQuery": "Force and Types of Force class 6 Science Maharashtra Balbharati"},"6|Science|Light and the Formation of Shadows":{"overview": "How light travels and how shadows form.", "notes": "Light travels in straight lines. Objects are transparent (glass), translucent (butter paper) or opaque (wood). Opaque objects block light and form shadows. A shadow's size changes with the distance between the object and the light source. A pinhole camera forms an inverted image.", "points": ["Light travels in a straight line.", "Opaque objects form shadows.", "Shadow size depends on distance from source."], "words": [{"word": "Opaque", "meaning": "Does not allow light to pass."}, {"word": "Translucent", "meaning": "Allows only some light to pass."}], "mcqs": [{"q": "Which object forms the darkest shadow?", "options": ["Glass", "Butter paper", "Wooden board", "Air"], "answer": 2}, {"q": "Light travels in?", "options": ["Curves", "Straight lines", "Circles", "Zigzags"], "answer": 1}], "fillBlanks": ["Glass is a ______ material. (transparent)"], "trueFalse": ["Shadows form behind opaque objects. (True)"], "oneWord": ["Which camera forms an inverted image? — Pinhole camera"], "videoQuery": "Light and the Formation of Shadows class 6 Science Maharashtra Balbharati"},"6|Science|Fun with Magnets":{"overview": "Properties of magnets and magnetic materials.", "notes": "A magnet attracts iron, nickel and cobalt. Every magnet has two poles, north and south. Like poles repel and unlike poles attract. A freely suspended magnet rests in the north–south direction, which is how a compass works.", "points": ["Magnets attract iron, nickel, cobalt.", "Like poles repel; unlike attract.", "A compass uses a magnet."], "words": [{"word": "Magnetic material", "meaning": "A material attracted by a magnet."}, {"word": "Pole", "meaning": "The end of a magnet where force is strongest."}], "mcqs": [{"q": "Like poles of magnets will?", "options": ["Attract", "Repel", "Merge", "Do nothing"], "answer": 1}, {"q": "Which is magnetic?", "options": ["Plastic", "Iron nail", "Wood", "Rubber"], "answer": 1}], "fillBlanks": ["A magnet has a north and a ______ pole. (south)"], "trueFalse": ["Unlike poles attract each other. (True)"], "oneWord": ["Which instrument shows direction using a magnet? — Compass"], "videoQuery": "Fun with Magnets class 6 Science Maharashtra Balbharati"},"6|Science|Light, Shadows and Reflection":{"overview": "Shadows and reflection of light.", "notes": "Light travels in straight lines. Opaque objects block light and form shadows; transparent ones let it pass. A mirror reflects light and forms an image of the object. A pinhole camera makes an inverted image.", "points": ["Light travels straight.", "Shadows form behind opaque objects.", "Mirrors reflect light."], "words": [{"word": "Reflection", "meaning": "Bouncing back of light from a surface."}, {"word": "Opaque", "meaning": "Does not let light pass."}], "mcqs": [{"q": "Which makes a shadow?", "options": ["Opaque object", "Clear glass", "Air", "Water"], "answer": 0}, {"q": "A mirror shows?", "options": ["Reflection", "Shadow only", "Nothing", "Sound"], "answer": 0}], "fillBlanks": ["Light travels in a ______ line. (straight)"], "trueFalse": ["Transparent objects form dark shadows. (False)"], "oneWord": ["What bounces light back? — Mirror"], "videoQuery": "Light, Shadows and Reflection class 6 Science Maharashtra Balbharati"},"6|Mathematics|Integers":{"overview": "Negative numbers, number line and operations.", "notes": "Integers are …, –3, –2, –1, 0, 1, 2, 3, …. On a number line, numbers to the right are greater. The opposite of +5 is –5. Adding a positive moves right; adding a negative moves left. The sum of an integer and its opposite is 0. Absolute value is the distance from zero.", "points": ["Positive numbers are right of zero.", "Opposite of 5 is –5.", "|–7| = 7.", "a + (–a) = 0."], "words": [{"word": "Integer", "meaning": "A whole number, its negative, or zero."}, {"word": "Absolute value", "meaning": "Distance of a number from zero."}], "mcqs": [{"q": "(–3) + 5 = ?", "options": ["–8", "2", "8", "–2"], "answer": 1}, {"q": "The opposite of –9 is?", "options": ["–9", "0", "9", "1"], "answer": 2}], "fillBlanks": ["The absolute value of –6 is ______. (6)"], "trueFalse": ["0 is a positive integer. (False)"], "oneWord": ["What is 7 + (–7)? — 0"], "videoQuery": "Integers class 6 Mathematics Maharashtra Balbharati"},"6|Mathematics|Angles":{"overview": "Types of angles and measuring with a protractor.", "notes": "An angle is formed by two rays with a common vertex. Acute: less than 90°. Right: 90°. Obtuse: between 90° and 180°. Straight: 180°. Reflex: between 180° and 360°. Two angles with sum 90° are complementary; with sum 180° are supplementary. Angles are measured with a protractor.", "points": ["Right angle = 90°.", "Complementary: sum 90°.", "Supplementary: sum 180°."], "words": [{"word": "Vertex", "meaning": "The common point of two rays of an angle."}, {"word": "Protractor", "meaning": "Instrument to measure angles."}], "mcqs": [{"q": "An angle of 120° is?", "options": ["Acute", "Right", "Obtuse", "Straight"], "answer": 2}, {"q": "Complement of 35° is?", "options": ["55°", "145°", "65°", "35°"], "answer": 0}], "fillBlanks": ["Two angles adding to 180° are ______. (supplementary)"], "trueFalse": ["A straight angle measures 180°. (True)"], "oneWord": ["Instrument used to measure an angle? — Protractor"], "videoQuery": "Angles class 6 Mathematics Maharashtra Balbharati"},"6|Mathematics|Percentage":{"overview": "Meaning of percent and conversions.", "notes": "Percent means 'per hundred'. 25% = 25/100 = 1/4 = 0.25. To find a percentage of a number, multiply: 20% of 150 = 20/100 × 150 = 30. To convert a fraction to a percent, multiply by 100.", "points": ["Percent = per hundred.", "50% = 1/2.", "x% of N = x/100 × N."], "words": [{"word": "Percent", "meaning": "A fraction with denominator 100."}, {"word": "Ratio", "meaning": "Comparison of two quantities."}], "mcqs": [{"q": "50% of 80 = ?", "options": ["20", "40", "50", "60"], "answer": 1}, {"q": "1/4 as a percent is?", "options": ["14%", "25%", "40%", "75%"], "answer": 1}], "fillBlanks": ["10% of 200 is ______. (20)"], "trueFalse": ["100% of a number is the number itself. (True)"], "oneWord": ["What is 1/2 as a percent? — 50%"], "videoQuery": "Percentage class 6 Mathematics Maharashtra Balbharati"},"7|Science|Heat":{"overview": "Temperature, heat transfer and thermometers.", "notes": "Heat is a form of energy that flows from a hot object to a cold one. Temperature tells how hot or cold an object is and is measured with a thermometer in °C. Heat travels by conduction (through solids), convection (in liquids and gases) and radiation (without a medium, like sunlight). Metals are good conductors; wood and plastic are insulators.", "points": ["Heat flows from hot to cold.", "Three modes: conduction, convection, radiation.", "Metals are good conductors."], "words": [{"word": "Conduction", "meaning": "Transfer of heat through a solid by contact."}, {"word": "Insulator", "meaning": "A material that does not conduct heat well."}], "mcqs": [{"q": "Heat from the Sun reaches us by?", "options": ["Conduction", "Convection", "Radiation", "None"], "answer": 2}, {"q": "Which is a good conductor?", "options": ["Wood", "Copper", "Plastic", "Rubber"], "answer": 1}], "fillBlanks": ["Temperature is measured with a ______. (thermometer)"], "trueFalse": ["Heat flows from a cold body to a hot body. (False)"], "oneWord": ["Which mode of heat transfer needs no medium? — Radiation"], "videoQuery": "Heat class 7 Science Maharashtra Balbharati"},"7|Science|Static Electricity":{"overview": "Charging by rubbing and the behaviour of charges.", "notes": "When two objects are rubbed, they can gain electric charge; this is static electricity. There are two kinds of charge, positive and negative. Like charges repel and unlike charges attract. A gold-leaf electroscope detects charge. Lightning is a natural discharge, and a lightning conductor protects buildings.", "points": ["Rubbing produces charge.", "Like charges repel; unlike attract.", "Electroscope detects charge."], "words": [{"word": "Electroscope", "meaning": "Instrument that detects electric charge."}, {"word": "Discharge", "meaning": "Loss of electric charge."}], "mcqs": [{"q": "Like charges?", "options": ["Attract", "Repel", "Cancel", "Merge"], "answer": 1}, {"q": "Lightning is a?", "options": ["Static discharge", "Magnet", "Sound wave", "Heat wave"], "answer": 0}], "fillBlanks": ["Rubbing a comb with hair produces ______ electricity. (static)"], "trueFalse": ["Unlike charges repel each other. (False)"], "oneWord": ["Which instrument detects charge? — Electroscope"], "videoQuery": "Static Electricity class 7 Science Maharashtra Balbharati"},"7|Science|Sound: Production of Sound":{"overview": "How sound is produced and travels.", "notes": "Sound is produced by vibrating objects. It needs a medium (solid, liquid or gas) to travel and cannot pass through a vacuum. Pitch depends on frequency and loudness on amplitude. Frequency is measured in hertz (Hz). Humans hear roughly 20 Hz to 20,000 Hz.", "points": ["Sound is caused by vibration.", "Needs a medium.", "Frequency in hertz."], "words": [{"word": "Vibration", "meaning": "To-and-fro motion."}, {"word": "Frequency", "meaning": "Number of vibrations per second."}], "mcqs": [{"q": "Sound cannot travel through?", "options": ["Air", "Water", "Vacuum", "Steel"], "answer": 2}, {"q": "Unit of frequency?", "options": ["Newton", "Hertz", "Metre", "Joule"], "answer": 1}], "fillBlanks": ["Sound is produced by ______ objects. (vibrating)"], "trueFalse": ["Loudness depends on amplitude. (True)"], "oneWord": ["What carries sound from source to ear? — A medium"], "videoQuery": "Sound: Production of Sound class 7 Science Maharashtra Balbharati"},"7|Science|Properties of a Magnetic Field":{"overview": "Magnetic field lines and their properties.", "notes": "The space around a magnet where its force acts is the magnetic field. It is shown by field lines that run from the north pole to the south pole outside the magnet. Lines never cross, and they are closer where the field is stronger. Iron filings show the pattern, and a compass needle lines up with the field.", "points": ["Field lines: north to south outside.", "Lines never cross.", "Closer lines mean a stronger field."], "words": [{"word": "Magnetic field", "meaning": "Region around a magnet where its force acts."}, {"word": "Field line", "meaning": "Line showing direction of the field."}], "mcqs": [{"q": "Field lines run from?", "options": ["South to north outside", "North to south outside", "East to west", "Do not exist"], "answer": 1}, {"q": "Field lines are closer where the field is?", "options": ["Weaker", "Stronger", "Zero", "Equal"], "answer": 1}], "fillBlanks": ["Iron ______ show the pattern of a magnetic field. (filings)"], "trueFalse": ["Magnetic field lines can cross each other. (False)"], "oneWord": ["What shows direction of a magnetic field? — Compass needle"], "videoQuery": "Properties of a Magnetic Field class 7 Science Maharashtra Balbharati"},"7|Mathematics|Angles and Pairs of Angles":{"overview": "Pairs of angles and angles made by a transversal.", "notes": "Complementary angles add up to 90° and supplementary angles to 180°. Adjacent angles share a vertex and an arm. Vertically opposite angles are equal. When a transversal cuts two parallel lines, corresponding angles are equal, alternate angles are equal and interior angles on the same side add up to 180°.", "points": ["Vertically opposite angles are equal.", "Linear pair adds to 180°.", "Corresponding angles are equal for parallel lines."], "words": [{"word": "Transversal", "meaning": "A line that cuts two or more lines."}, {"word": "Linear pair", "meaning": "Two adjacent angles that add up to 180°."}], "mcqs": [{"q": "Vertically opposite angles are?", "options": ["Supplementary", "Equal", "Complementary", "Unequal"], "answer": 1}, {"q": "Supplement of 70° is?", "options": ["20°", "110°", "290°", "70°"], "answer": 1}], "fillBlanks": ["Complement of 40° is ______. (50°)"], "trueFalse": ["Corresponding angles are equal when lines are parallel. (True)"], "oneWord": ["Two angles adding to 90° are called? — Complementary"], "videoQuery": "Angles and Pairs of Angles class 7 Mathematics Maharashtra Balbharati"},"7|Mathematics|Indices":{"overview": "Powers, bases and laws of indices.", "notes": "In a^n, a is the base and n is the index. Laws: a^m × a^n = a^(m+n); a^m ÷ a^n = a^(m–n); (a^m)^n = a^(mn). Any non-zero number to the power 0 is 1. Example: 2^3 × 2^2 = 2^5 = 32.", "points": ["a^m × a^n = a^(m+n).", "a^0 = 1.", "(a^m)^n = a^(mn)."], "words": [{"word": "Base", "meaning": "The number that is multiplied."}, {"word": "Index", "meaning": "The power showing how many times to multiply."}], "mcqs": [{"q": "2^3 × 2^2 = ?", "options": ["2^5", "2^6", "4^5", "2^1"], "answer": 0}, {"q": "5^0 = ?", "options": ["0", "1", "5", "Undefined"], "answer": 1}], "fillBlanks": ["3^2 = ______. (9)"], "trueFalse": ["(a^m)^n = a^(m+n). (False)"], "oneWord": ["What is 10^2? — 100"], "videoQuery": "Indices class 7 Mathematics Maharashtra Balbharati"},"7|Mathematics|Pythagoras' Theorem":{"overview": "Relation between the sides of a right-angled triangle.", "notes": "In a right-angled triangle, the square of the hypotenuse equals the sum of the squares of the other two sides: c² = a² + b². The hypotenuse is the longest side, opposite the right angle. Triplets like (3, 4, 5) and (5, 12, 13) satisfy the theorem.", "points": ["c² = a² + b².", "Hypotenuse is the longest side.", "(3,4,5) is a Pythagorean triplet."], "words": [{"word": "Hypotenuse", "meaning": "Side opposite the right angle."}, {"word": "Triplet", "meaning": "Three numbers that satisfy a rule."}], "mcqs": [{"q": "If legs are 3 and 4, hypotenuse is?", "options": ["5", "6", "7", "12"], "answer": 0}, {"q": "Hypotenuse is opposite the?", "options": ["Acute angle", "Right angle", "Base", "Vertex only"], "answer": 1}], "fillBlanks": ["In (5, 12, 13), the hypotenuse is ______. (13)"], "trueFalse": ["The hypotenuse is the shortest side. (False)"], "oneWord": ["Name a Pythagorean triplet. — 3, 4, 5"], "videoQuery": "Pythagoras' Theorem class 7 Mathematics Maharashtra Balbharati"},"7|Mathematics|Perimeter and Area":{"overview": "Formulae for perimeter and area of plane figures.", "notes": "Perimeter is the distance around a figure; area is the surface it covers. Rectangle: perimeter 2(l+b), area l×b. Square: perimeter 4a, area a². Triangle: area ½ × base × height. Circle: circumference 2πr, area πr². Area is in square units.", "points": ["Rectangle area = l × b.", "Triangle area = ½ × b × h.", "Circle area = πr²."], "words": [{"word": "Perimeter", "meaning": "Total length of the boundary."}, {"word": "Area", "meaning": "Surface covered by a figure."}], "mcqs": [{"q": "Area of a rectangle 5 by 4?", "options": ["9", "18", "20", "40"], "answer": 2}, {"q": "Area of a triangle with base 6, height 4?", "options": ["10", "12", "24", "20"], "answer": 1}], "fillBlanks": ["Perimeter of a square of side 5 is ______. (20)"], "trueFalse": ["Area is measured in square units. (True)"], "oneWord": ["Formula for circumference of a circle? — 2πr"], "videoQuery": "Perimeter and Area class 7 Mathematics Maharashtra Balbharati"},"7|History|Preamble to the Constitution":{"overview": "The Preamble and its key words.", "notes": "The Preamble is the introduction to the Constitution. It begins with 'We, the people of India' and states that India is a sovereign, socialist, secular, democratic republic. It promises justice, liberty, equality and fraternity to all citizens. The Constitution came into effect on 26 January 1950.", "points": ["Starts with 'We, the people of India'.", "Promises justice, liberty, equality, fraternity.", "Constitution effective 26 Jan 1950."], "words": [{"word": "Sovereign", "meaning": "Completely independent."}, {"word": "Fraternity", "meaning": "Feeling of brotherhood."}], "mcqs": [{"q": "Constitution came into effect on?", "options": ["15 Aug 1947", "26 Jan 1950", "2 Oct 1950", "26 Nov 1949"], "answer": 1}, {"q": "Preamble begins with?", "options": ["We, the people of India", "Jai Hind", "Long live India", "None"], "answer": 0}], "fillBlanks": ["India is a ______ republic. (democratic)"], "trueFalse": ["The Preamble promises equality. (True)"], "oneWord": ["Which word means completely independent? — Sovereign"], "videoQuery": "Preamble to the Constitution class 7 History Maharashtra Balbharati"},"7|History|Features of the Constitution":{"overview": "Main features of the Indian Constitution.", "notes": "The Indian Constitution is the longest written constitution. It establishes a federal system with a strong centre, a parliamentary form of government, and guarantees fundamental rights. It provides for an independent judiciary and adult franchise. Dr. B. R. Ambedkar chaired the Drafting Committee.", "points": ["Written and detailed.", "Parliamentary democracy.", "Independent judiciary."], "words": [{"word": "Federal", "meaning": "Power shared between centre and states."}, {"word": "Franchise", "meaning": "The right to vote."}], "mcqs": [{"q": "Who chaired the Drafting Committee?", "options": ["Nehru", "Ambedkar", "Patel", "Gandhi"], "answer": 1}, {"q": "Our form of government is?", "options": ["Monarchy", "Parliamentary", "Military", "Tribal"], "answer": 1}], "fillBlanks": ["The Constitution gives every adult the right to ______. (vote)"], "trueFalse": ["India has an independent judiciary. (True)"], "oneWord": ["Who chaired the Drafting Committee? — Dr. B. R. Ambedkar"], "videoQuery": "Features of the Constitution class 7 History Maharashtra Balbharati"},"7|Geography|Tides":{"overview": "Causes of high and low tides.", "notes": "Tides are the rise and fall of sea level caused mainly by the Moon's gravity and also the Sun's. High tide is the rising of water, low tide the falling. Spring tides occur on full-moon and new-moon days when the Sun, Moon and Earth are in a line, giving the highest tides. Neap tides occur on the quarter-moon days with the lowest tides.", "points": ["Moon's gravity causes tides.", "Spring tides on full and new moon.", "Neap tides on quarter-moon days."], "words": [{"word": "Tide", "meaning": "Regular rise and fall of sea level."}, {"word": "Spring tide", "meaning": "Highest tide at new and full moon."}], "mcqs": [{"q": "Tides are mainly caused by?", "options": ["Wind", "Moon's gravity", "Earthquakes", "Rain"], "answer": 1}, {"q": "Spring tides occur on?", "options": ["Quarter-moon", "Full and new moon", "Only summer", "Never"], "answer": 1}], "fillBlanks": ["The lowest tides are called ______ tides. (neap)"], "trueFalse": ["The Sun also affects tides. (True)"], "oneWord": ["What mainly causes tides? — Moon's gravity"], "videoQuery": "Tides class 7 Geography Maharashtra Balbharati"},"7|Geography|Winds":{"overview": "Types of winds and how they form.", "notes": "Wind is air moving from high pressure to low pressure. Planetary winds blow all year: trade winds, westerlies and polar easterlies. Seasonal winds change with the seasons, like the monsoon. Local winds such as land and sea breezes blow in small areas. Wind speed is measured by an anemometer.", "points": ["Winds blow from high to low pressure.", "Planetary, seasonal, local winds.", "Anemometer measures wind speed."], "words": [{"word": "Monsoon", "meaning": "Seasonal wind that brings rain."}, {"word": "Anemometer", "meaning": "Instrument that measures wind speed."}], "mcqs": [{"q": "Wind blows from?", "options": ["Low to high", "High to low pressure", "Sea only", "Land only"], "answer": 1}, {"q": "Monsoon is a?", "options": ["Local wind", "Seasonal wind", "Planetary wind", "Still air"], "answer": 1}], "fillBlanks": ["Trade winds are ______ winds. (planetary)"], "trueFalse": ["A sea breeze blows from sea to land. (True)"], "oneWord": ["Which instrument measures wind speed? — Anemometer"], "videoQuery": "Winds class 7 Geography Maharashtra Balbharati"},"7|Geography|Soils":{"overview": "Formation, layers and types of soil.", "notes": "Soil forms from the weathering of rocks over a long time, along with humus from dead plants and animals. A soil profile has topsoil, subsoil and bedrock. Main types are alluvial, black, red and laterite. Black soil is good for cotton. Soil erosion can be reduced by planting trees and terrace farming.", "points": ["Soil forms from weathered rock and humus.", "Alluvial, black, red, laterite soils.", "Black soil suits cotton."], "words": [{"word": "Humus", "meaning": "Dark organic matter from decayed plants and animals."}, {"word": "Erosion", "meaning": "Removal of soil by wind or water."}], "mcqs": [{"q": "Black soil is best for?", "options": ["Rice only", "Cotton", "Tea only", "Coconut only"], "answer": 1}, {"q": "The top layer of soil is?", "options": ["Bedrock", "Subsoil", "Topsoil", "Rock"], "answer": 2}], "fillBlanks": ["The decayed matter in soil is ______. (humus)"], "trueFalse": ["Planting trees can reduce soil erosion. (True)"], "oneWord": ["Which soil is good for cotton? — Black soil"], "videoQuery": "Soils class 7 Geography Maharashtra Balbharati"},"8|Science|Crop Production and Management":{"overview": "Growing crops: steps from soil preparation to storage.", "notes": "Crops are plants grown on a large scale. Kharif crops (paddy, maize) are sown in the rainy season; rabi crops (wheat, gram) in winter. Steps: preparing soil, sowing, adding manure and fertilisers, irrigation, weeding, harvesting, threshing and storage. Seed drills, sprinklers and drip irrigation save effort and water.", "points": ["Kharif = rainy season, Rabi = winter.", "Weeding removes unwanted plants.", "Drip irrigation saves water."], "words": [{"word": "Harvesting", "meaning": "Cutting the mature crop"}, {"word": "Fertiliser", "meaning": "Chemical that adds nutrients to soil"}], "mcqs": [{"q": "Wheat is a?", "options": ["Kharif crop", "Rabi crop", "Fruit", "Weed"], "answer": 1}, {"q": "Separating grain from chaff is?", "options": ["Sowing", "Threshing", "Weeding", "Tilling"], "answer": 1}], "fillBlanks": ["Loosening and turning soil is called ______. (tilling)"], "trueFalse": ["Paddy is a rabi crop. (False)"], "oneWord": ["Which irrigation method saves most water? — Drip"], "videoQuery": "Crop Production and Management class 8 Science Maharashtra Balbharati"},"8|Science|Microorganisms":{"overview": "Tiny living things: useful and harmful ones.", "notes": "Microorganisms are seen only under a microscope: bacteria, fungi, protozoa, algae and viruses. They help make curd, bread and medicines, and clean the environment. Some cause diseases like malaria, cholera and typhoid. Food is preserved by salting, sugar, oil, heating and refrigeration. Vaccines protect us from many diseases.", "points": ["Yeast makes bread and cake rise.", "Antibiotics kill bacteria.", "Mosquitoes carry malaria germs."], "words": [{"word": "Antibiotic", "meaning": "Medicine that kills bacteria"}, {"word": "Vaccine", "meaning": "Prepared dose that gives immunity"}], "mcqs": [{"q": "Curd is made by?", "options": ["Yeast", "Lactobacillus", "Virus", "Algae"], "answer": 1}, {"q": "Malaria is carried by?", "options": ["Housefly", "Female Anopheles", "Cockroach", "Bee"], "answer": 1}], "fillBlanks": ["Yeast is a type of ______. (fungus)"], "trueFalse": ["Antibiotics work against viruses. (False)"], "oneWord": ["Who discovered the smallpox vaccine? — Edward Jenner"], "videoQuery": "Microorganisms class 8 Science Maharashtra Balbharati"},"8|Science|Synthetic Fibres and Plastics":{"overview": "Man-made fibres and plastics, and their uses.", "notes": "Synthetic fibres like nylon, polyester, rayon and acrylic are made from chemicals. They are strong, dry quickly and cheap but catch fire easily. Plastics are of two kinds: thermoplastics (can be remoulded, e.g. PVC) and thermosetting (cannot, e.g. Bakelite). Plastics are non-biodegradable, so follow the 5 R's: reduce, reuse, recycle, recover, refuse.", "points": ["Nylon is very strong.", "Bakelite is thermosetting.", "Plastics pollute the environment."], "words": [{"word": "Polymer", "meaning": "Large molecule of repeating units"}, {"word": "Biodegradable", "meaning": "Broken down naturally by microbes"}], "mcqs": [{"q": "First fully synthetic fibre?", "options": ["Rayon", "Nylon", "Cotton", "Wool"], "answer": 1}, {"q": "Bakelite is a?", "options": ["Thermoplastic", "Thermosetting plastic", "Fibre", "Metal"], "answer": 1}], "fillBlanks": ["Plastic does not ______ naturally. (decompose)"], "trueFalse": ["Nylon is a natural fibre. (False)"], "oneWord": ["Which plastic is used for electrical switches? — Bakelite"], "videoQuery": "Synthetic Fibres and Plastics class 8 Science Maharashtra Balbharati"},"8|Science|Metals and Non-metals":{"overview": "Properties and uses of metals and non-metals.", "notes": "Metals are lustrous, malleable, ductile and good conductors; non-metals are dull, brittle and poor conductors (graphite is an exception). Metals react with oxygen to form basic oxides; non-metals form acidic oxides. Reactive metals like sodium react with water, and a more reactive metal displaces a less reactive one from its salt solution.", "points": ["Metals are sonorous and malleable.", "Mercury is a liquid metal.", "Iron rusts in moist air."], "words": [{"word": "Malleable", "meaning": "Can be beaten into sheets"}, {"word": "Ductile", "meaning": "Can be drawn into wires"}], "mcqs": [{"q": "Liquid non-metal at room temperature?", "options": ["Mercury", "Bromine", "Sodium", "Iron"], "answer": 1}, {"q": "Which is a good conductor?", "options": ["Sulphur", "Copper", "Wood", "Iodine"], "answer": 1}], "fillBlanks": ["Metal oxides are generally ______ in nature. (basic)"], "trueFalse": ["All non-metals are bad conductors of electricity. (False)"], "oneWord": ["Which metal is stored in kerosene? — Sodium"], "videoQuery": "Metals and Non-metals class 8 Science Maharashtra Balbharati"},"8|Science|Coal and Petroleum":{"overview": "Fossil fuels, their formation and use.", "notes": "Coal and petroleum are fossil fuels formed from dead plants and animals buried millions of years ago. Coal is refined into coke, coal tar and coal gas. Petroleum is separated into petrol, diesel, kerosene, LPG and bitumen by fractional distillation in a refinery. They are exhaustible, so we must save them (PCRA tips).", "points": ["Coal is almost pure carbon.", "CNG is a cleaner fuel.", "Fossil fuels are non-renewable."], "words": [{"word": "Fossil fuel", "meaning": "Fuel formed from ancient living things"}, {"word": "Carbonisation", "meaning": "Slow conversion of plants into coal"}], "mcqs": [{"q": "Petroleum is separated by?", "options": ["Filtration", "Fractional distillation", "Evaporation", "Sieving"], "answer": 1}, {"q": "Used for road making?", "options": ["Bitumen", "LPG", "Petrol", "Coke"], "answer": 0}], "fillBlanks": ["Coal is formed by ______. (carbonisation)"], "trueFalse": ["Petroleum is a renewable resource. (False)"], "oneWord": ["Which product of coal is used in steel making? — Coke"], "videoQuery": "Coal and Petroleum class 8 Science Maharashtra Balbharati"},"8|Science|Combustion and Flame":{"overview": "Burning, types of fuel and flame structure.", "notes": "Combustion is burning of a substance in oxygen with heat and light. Needs: fuel, air (oxygen) and ignition temperature. Rapid, spontaneous and explosive are types of combustion. A candle flame has three zones: dark inner zone, luminous middle zone and non-luminous outer zone, which is hottest. A good fuel has high calorific value. Fires are put out by cutting off air, fuel or heat; water should not be used on oil or electrical fires.", "points": ["Burning needs oxygen.", "Outer zone of flame is hottest.", "Calorific value measured in kJ/kg."], "words": [{"word": "Ignition temperature", "meaning": "Lowest temperature at which a substance catches fire"}, {"word": "Calorific value", "meaning": "Heat produced by burning 1 kg fuel"}], "mcqs": [{"q": "Hottest zone of flame?", "options": ["Inner", "Middle", "Outer", "All same"], "answer": 2}, {"q": "Fire extinguisher for electrical fire?", "options": ["Water", "CO2", "Sand only", "None"], "answer": 1}], "fillBlanks": ["Fuel needs ______ temperature to burn. (ignition)"], "trueFalse": ["Water is best for oil fires. (False)"], "oneWord": ["Which gas is used in fire extinguishers? — Carbon dioxide"], "videoQuery": "Combustion and Flame class 8 Science Maharashtra Balbharati"},"8|Science|Conservation of Plants and Animals":{"overview": "Protecting biodiversity.", "notes": "Deforestation and pollution harm plants and animals. Protected areas are national parks, wildlife sanctuaries and biosphere reserves. Endemic species live only in one area; endangered species are at risk of extinction, listed in the Red Data Book. Migration, reforestation and recycling paper help conservation.", "points": ["Flora = plants, fauna = animals.", "Red Data Book lists endangered species.", "Plant more trees."], "words": [{"word": "Biodiversity", "meaning": "Variety of living things"}, {"word": "Extinct", "meaning": "No longer exists"}], "mcqs": [{"q": "Red Data Book records?", "options": ["Rainfall", "Endangered species", "Crops", "Rivers"], "answer": 1}, {"q": "Planting trees again is?", "options": ["Deforestation", "Reforestation", "Erosion", "Migration"], "answer": 1}], "fillBlanks": ["Species found only in one region are called ______. (endemic)"], "trueFalse": ["Sanctuaries allow hunting freely. (False)"], "oneWord": ["Which tiger reserve is in Maharashtra? — Tadoba"], "videoQuery": "Conservation of Plants and Animals class 8 Science Maharashtra Balbharati"},"8|Science|Cell — Structure and Functions":{"overview": "The cell as the basic unit of life.", "notes": "Cells were discovered by Robert Hooke and are the basic unit of life. Organisms may be unicellular or multicellular. Parts: cell membrane, cytoplasm and nucleus (control centre). Plant cells have a cell wall and large vacuole and chloroplasts; animal cells have no cell wall. Nucleus holds chromosomes made of DNA.", "points": ["Nucleus controls the cell.", "Plant cells have a cell wall.", "Chloroplasts make food."], "words": [{"word": "Cytoplasm", "meaning": "Jelly-like fluid inside the cell"}, {"word": "Chromosome", "meaning": "Thread-like structure carrying genes"}], "mcqs": [{"q": "Control centre of cell?", "options": ["Vacuole", "Nucleus", "Wall", "Membrane"], "answer": 1}, {"q": "Found only in plant cells?", "options": ["Nucleus", "Chloroplast", "Cytoplasm", "Membrane"], "answer": 1}], "fillBlanks": ["The ______ gives shape to plant cells. (cell wall)"], "trueFalse": ["Amoeba is multicellular. (False)"], "oneWord": ["Who discovered cells? — Robert Hooke"], "videoQuery": "Cell — Structure and Functions class 8 Science Maharashtra Balbharati"},"8|Science|Reproduction in Animals":{"overview": "How animals produce young ones.", "notes": "Reproduction can be sexual or asexual. In sexual reproduction a sperm fertilises an egg to form a zygote. Fertilisation may be external (frogs, fish) or internal (humans, birds). Animals are oviparous (lay eggs) or viviparous (give birth). Hydra reproduces by budding; frog changes through metamorphosis (egg, tadpole, adult).", "points": ["Zygote is a fertilised egg.", "Hydra reproduces by budding.", "Frog shows metamorphosis."], "words": [{"word": "Zygote", "meaning": "Cell formed after fertilisation"}, {"word": "Viviparous", "meaning": "Gives birth to young ones"}], "mcqs": [{"q": "External fertilisation occurs in?", "options": ["Dog", "Frog", "Human", "Cow"], "answer": 1}, {"q": "Budding is seen in?", "options": ["Hydra", "Hen", "Cat", "Man"], "answer": 0}], "fillBlanks": ["Animals that lay eggs are called ______. (oviparous)"], "trueFalse": ["Humans show external fertilisation. (False)"], "oneWord": ["What is the change from tadpole to frog called? — Metamorphosis"], "videoQuery": "Reproduction in Animals class 8 Science Maharashtra Balbharati"},"8|Science|Reaching the Age of Adolescence":{"overview": "Changes during puberty.", "notes": "Adolescence is the period of 11–19 years when puberty occurs. Boys develop a deeper voice and facial hair; girls begin menstruation. Growth is controlled by hormones: testosterone, oestrogen, and insulin, thyroxine from glands. Balanced diet, hygiene, exercise and avoiding drugs are important. Sex of a baby depends on the X and Y chromosomes from the father.", "points": ["Hormones are chemical messengers.", "Puberty starts around 10–12 years.", "Eat a balanced diet."], "words": [{"word": "Puberty", "meaning": "Stage when reproductive organs mature"}, {"word": "Hormone", "meaning": "Chemical secreted by glands"}], "mcqs": [{"q": "Male hormone?", "options": ["Oestrogen", "Testosterone", "Insulin", "Thyroxine"], "answer": 1}, {"q": "Gland causing goitre when lacking iodine?", "options": ["Thyroid", "Pituitary", "Adrenal", "Pancreas"], "answer": 0}], "fillBlanks": ["Insulin is made by the ______. (pancreas)"], "trueFalse": ["Sex of a child is decided by the mother. (False)"], "oneWord": ["Which gland is called the master gland? — Pituitary"], "videoQuery": "Reaching the Age of Adolescence class 8 Science Maharashtra Balbharati"},"8|Science|Force and Pressure":{"overview": "Pushes, pulls and pressure of solids, liquids and gases.", "notes": "A force is a push or pull. It can change speed, direction or shape of an object. Contact forces: muscular, friction; non-contact: gravity, magnetic, electrostatic. Pressure = force / area, measured in pascal. Liquids and gases exert pressure; atmospheric pressure acts on us in all directions.", "points": ["Force unit is newton.", "Pressure = force/area.", "Sharp knife exerts more pressure."], "words": [{"word": "Pascal", "meaning": "Unit of pressure"}, {"word": "Atmospheric pressure", "meaning": "Pressure by air around Earth"}], "mcqs": [{"q": "Unit of force?", "options": ["Pascal", "Newton", "Joule", "Watt"], "answer": 1}, {"q": "Smaller area gives?", "options": ["Less pressure", "More pressure", "No pressure", "Same"], "answer": 1}], "fillBlanks": ["Pressure = force ÷ ______. (area)"], "trueFalse": ["Gravity is a contact force. (False)"], "oneWord": ["Which force pulls objects to the Earth? — Gravity"], "videoQuery": "Force and Pressure class 8 Science Maharashtra Balbharati"},"8|Science|Friction":{"overview": "Force that opposes motion.", "notes": "Friction opposes relative motion between surfaces in contact. It depends on the roughness of surfaces and the force pressing them. Types: static, sliding and rolling friction; rolling is the least. It is increased by treads on tyres and reduced by lubricants, ball bearings and streamlining. Friction produces heat and wear.", "points": ["Friction acts opposite to motion.", "Rolling friction is smallest.", "Oil reduces friction."], "words": [{"word": "Lubricant", "meaning": "Substance that reduces friction"}, {"word": "Streamlined", "meaning": "Shaped to reduce air or water drag"}], "mcqs": [{"q": "Least friction?", "options": ["Static", "Sliding", "Rolling", "All equal"], "answer": 2}, {"q": "Which reduces friction?", "options": ["Grease", "Sand", "Rough road", "Tyre tread"], "answer": 0}], "fillBlanks": ["Friction produces ______. (heat)"], "trueFalse": ["Friction always harms us. (False)"], "oneWord": ["Why are fish streamlined? — To reduce water friction"], "videoQuery": "Friction class 8 Science Maharashtra Balbharati"},"8|Science|Sound":{"overview": "Production, travel and properties of sound.", "notes": "Sound is produced by vibrating objects and needs a medium to travel; it cannot pass through a vacuum. Frequency is measured in hertz; humans hear 20 Hz to 20,000 Hz. Amplitude decides loudness (decibel) and frequency decides pitch. Unwanted loud sound is noise; noise pollution harms hearing. Sound is the fastest in solids.", "points": ["Sound needs a medium.", "Pitch depends on frequency.", "Loudness depends on amplitude."], "words": [{"word": "Frequency", "meaning": "Vibrations per second"}, {"word": "Amplitude", "meaning": "Maximum displacement of a vibration"}], "mcqs": ields and trees during storms. Earthquakes are sudden vibrations of the Earth's crust, measured by a seismograph on the Richter scale. Build earthquake-resistant houses.", "points": ["Lightning is electric discharge.", "Seismograph records earthquakes.", "Stay indoors in a thunderstorm."], "words": [{"word": "Seismograph", "meaning": "Instrument to record earthquake waves"}, {"word": "Epicentre", "meaning": "Point on surface above the earthquake origin"}], "mcqs": [{"q": "Earthquake scale?", "options": ["Richter", "Kelvin", "pH", "Decibel"], "answer": 0}, {"q": "Like charges?", "options": ["Attract", "Repel", "Cancel", "Join"], "answer": 1}], "fillBlanks": ["Instrument to detect charge is the ______. (electroscope)"], "trueFalse": ["It is safe to stand under a tree in lightning. (False)"], "oneWord": ["Who invented the lightning conductor? — Benjamin Franklin"], "videoQuery": "Some Natural Phenomena class 8 Science Maharashtra Balbharati"},"8|Science|Light":{"overview": "Reflection, refraction and the human eye.", "notes": "Light travels in straight lines. Laws of reflection: angle of incidence equals angle of reflection. Plane mirrors form virtual, laterally inverted images. White light splits into seven colours (VIBGYOR) in dispersion. The eye has cornea, iris, pupil, lens and retina. Braille helps visually impaired people read.", "points": ["Angle i = angle r.", "White light has 7 colours.", "Retina forms the image."], "words": [{"word": "Dispersion", "meaning": "Splitting of white light into colours"}, {"word": "Retina", "meaning": "Light-sensitive layer of the eye"}], "mcqs": [{"q": "Image in plane mirror is?", "options": ["Real", "Virtual", "Inverted vertically", "Bigger"], "answer": 1}, {"q": "Controls light entering the eye?", "options": ["Iris", "Retina", "Cornea", "Lens"], "answer": 0}], "fillBlanks": ["The rainbow is formed by ______ of light. (dispersion)"], "trueFalse": ["Angle of incidence is more than angle of reflection. (False)"], "oneWord": ["Which
